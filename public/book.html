  <link rel="stylesheet" href="/style.css">
  <script>
    // Theme: Check localStorage first, then system preference, default light
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

</head>

  </div>
  <div class="nav-right">
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" onclick="toggleTheme()">
      <span class="theme-icon sun">☀️</span>
      <span class="theme-icon moon">🌙</span>
    </button>
    <div class="nav-search-wrap">
      <input type="text" class="nav-search" id="nav-search" placeholder="Search…" autocomplete="off">

  </div>
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Menu" onclick="toggleNav()">

</nav>

    <li><a href="/">Home</a></li>

    <div class="footer-links"></div>
    <p class="footer-copy">© <span id="footer-year"></span> Nekojin Interactive LLC. All rights reserved.</p>
    <script>document.getElementById('footer-year').textContent = new Date().getFullYear();</script>
  </div>
</footer>

<script src="/common.js"></script>
<script src="/js/book.js" defer></script>

</body>
</html>
