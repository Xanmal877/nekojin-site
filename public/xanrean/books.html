<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books - Xanrean Chronicles | Nekojin Interactive</title>
  <meta name="description" content="The complete Xanrean Chronicles book collection - every series, novella, and omnibus in the world of Xanrea.">
  <meta name="keywords" content="xanrean chronicles books, her majesty tamaneko, the bedrock, nekojin interactive, fantasy novels, progression fiction">
  <meta property="og:title" content="Books - Xanrean Chronicles">
  <meta property="og:description" content="Every series, novella, and omnibus in the world of Xanrea.">
  <meta property="og:image" content="https://worldofxanrea.com/covers/sb-cover.png">
  <meta name="theme-color" content="#0a0614">
  <link rel="stylesheet" href="/style.css">
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <style>
    /* Nav */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(124,58,237,0.1);
    }

    [data-theme="dark"] nav {
      background: rgba(10,6,20,0.9);
      border-bottom-color: rgba(124,58,237,0.2);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--royal);
      text-decoration: none;
    }

    .nav-tama {
      width: 32px;
      height: 32px;
      background: url('/images/tama-icon.png') center/contain no-repeat;
      image-rendering: pixelated;
    }

    .theme-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.25rem;
      color: var(--text);
    }

    .theme-toggle:hover {
      background: var(--surface2);
    }

    /* Hero */
    .books-hero {
      padding: 8rem 2rem 3rem;
      text-align: center;
      background: linear-gradient(180deg, rgba(124,58,237,0.1) 0%, transparent 100%);
    }

    .books-hero h1 {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 6vw, 4rem);
      background: linear-gradient(135deg, #c4b5fd, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .books-hero p {
      max-width: 600px;
      margin: 1rem auto 0;
      color: var(--muted);
    }

    /* Series jump-nav */
    .series-jump {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      max-width: 900px;
      margin: 2rem auto 0;
    }

    .series-jump a {
      padding: 0.4rem 1rem;
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .series-jump a:hover {
      color: var(--royal-light);
      border-color: rgba(139,92,246,0.5);
      background: rgba(124,58,237,0.08);
    }

    /* Group Section */
    .tier-section {
      padding: 4rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .tier-section + .tier-section {
      border-top: 1px solid var(--border);
    }

    .tier-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .tier-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .tier-badge.series {
      background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(124,58,237,0.2));
      border: 1px solid rgba(139,92,246,0.4);
      color: #c4b5fd;
    }

    .tier-badge.novella {
      background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(37,99,235,0.2));
      border: 1px solid rgba(59,130,246,0.4);
      color: #93c5fd;
    }

    .tier-badge.omnibus {
      background: linear-gradient(135deg, rgba(245,158,11,0.2), rgba(217,119,6,0.2));
      border: 1px solid rgba(245,158,11,0.4);
      color: #fcd34d;
    }

    .tier-header h2 {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      margin-bottom: 0.5rem;
    }

    .tier-header p {
      color: var(--muted);
      max-width: 620px;
      margin: 0 auto;
    }

    /* Books Grid */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    .book-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }

    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    [data-theme="light"] .book-card:hover {
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }

    .book-cover {
      aspect-ratio: 2/3;
      background: var(--surface2);
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .book-cover::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.5) 100%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .book-card:hover .book-cover::after {
      opacity: 1;
    }

    .book-status {
      position: absolute;
      top: 1rem;
      left: 1rem;
      padding: 0.25rem 0.75rem;
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .book-status.published {
      background: rgba(16,185,129,0.9);
      color: white;
    }

    .book-status.preview {
      background: rgba(245,158,11,0.9);
      color: white;
    }

    .book-status.draft {
      background: rgba(107,114,128,0.9);
      color: white;
    }

    .book-info {
      padding: 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .book-volume {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }

    .book-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }

    .book-blurb {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.6;
      flex: 1;
    }

    .book-meta {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
    }

    .book-meta span {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }

    .empty-state-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    /* Footer */
    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      margin-top: 4rem;
    }

    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-display);
      font-size: 1rem;
      color: var(--royal);
    }

    .footer-tama {
      width: 24px;
      height: 24px;
      background: url('/images/tama-icon.png') center/contain no-repeat;
      image-rendering: pixelated;
    }

    .footer-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .footer-link:hover {
      color: var(--royal-light);
    }

    @media (max-width: 768px) {
      .footer-inner { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo"><div class="nav-tama"></div>Nekojin Interactive</a>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
    <span id="theme-icon">☀️</span>
  </button>
</nav>

<main>
  <section class="books-hero">
    <p style="font-size: 0.75rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--royal-light); margin-bottom: 1rem;">✦ Xanrean Chronicles</p>
    <h1>The Collection</h1>
    <p>Enter the world of Xanrea. Follow the Administrators through interconnected stories of reincarnation, magic, and digital souls.</p>
    <div class="series-jump" id="series-jump"></div>
  </section>

  <!-- Group sections are rendered here from the live catalog -->
  <div id="groups"></div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-brand"><div class="footer-tama"></div>Nekojin Interactive</div>
    <a href="/xanrean" class="footer-link">← Back to Xanrean Chronicles</a>
  </div>
</footer>

<script>
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme') || 'light';
  const next = current === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.getElementById('theme-icon').textContent = next === 'dark' ? '🌙' : '☀️';
}

document.getElementById('theme-icon').textContent =
  (document.documentElement.getAttribute('data-theme') === 'dark') ? '🌙' : '☀️';

// Format word count
function formatCount(n) {
  if (n >= 1000) return (n/1000).toFixed(1) + 'k';
  return String(n);
}

// Escape HTML
function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderBookCard(book) {
  // A book with status "published" but no purchase/read links attached
  // isn't actually out yet, so badge it as upcoming rather than claiming
  // it's published when there's nowhere to get it.
  const hasLinks = (book.platforms || []).some(p => p.url);
  const rawStatus = !hasLinks ? 'draft' : (book.status || 'draft');
  // Map to a fixed allowlist so a stored status string can never inject
  // markup into the class attribute or the badge label.
  const statusClass = ['published', 'preview', 'draft'].includes(rawStatus) ? rawStatus : 'draft';
  const statusLabel = { published: 'Published', preview: 'Preview', draft: 'Coming Soon' }[statusClass] || statusClass;
  const words = book.word_count ? `${formatCount(book.word_count)} words` : '';
  const vol = book.volume ? book.volume : (book.volume_number ? `Vol. ${book.volume_number}` : '');
  const cover = String(book.cover || '/images/placeholder-cover.png');
  const safeCover = (/^(?:https?:\/\/|\/(?!\/))/.test(cover) && !/[\s"'()\\<>`]/.test(cover))
    ? cover
    : '/images/placeholder-cover.png';
  const blurb = book.blurb || book.description || '';

  return `
    <a href="/book?id=${esc(book.slug)}&from=xanrean" class="book-card">
      <div class="book-cover" style="background-image: url('${safeCover}')">
        <span class="book-status ${statusClass}">${statusLabel}</span>
      </div>
      <div class="book-info">
        ${vol ? `<div class="book-volume">${esc(vol)}</div>` : ''}
        <h3 class="book-title">${esc(book.title)}</h3>
        <p class="book-blurb">${esc(blurb).slice(0, 120)}${blurb.length > 120 ? '...' : ''}</p>
        <div class="book-meta">
          ${words ? `<span>📝 ${words}</span>` : ''}
        </div>
      </div>
    </a>
  `;
}

function groupSection({ id, badge, badgeClass, heading, blurb, books }) {
  if (!books.length) return '';
  return `
    <section class="tier-section" id="${esc(id)}">
      <div class="tier-header">
        <div class="tier-badge ${badgeClass}">${badge}</div>
        <h2>${esc(heading)}</h2>
        ${blurb ? `<p>${esc(blurb)}</p>` : ''}
      </div>
      <div class="books-grid">
        ${books.map(renderBookCard).join('')}
      </div>
    </section>
  `;
}

function emptyState(icon, msg) {
  return `
    <div class="empty-state">
      <div class="empty-state-icon">${icon}</div>
      <p>${esc(msg)}</p>
    </div>
  `;
}

// Load the catalog and render the hierarchy:
//   Xanrean Chronicles (master)
//     ├─ series sections (HMT, The Bedrock, GHH, ...)
//     ├─ Novella Standalones
//     └─ Omnibuses
async function loadBooks() {
  const groupsEl = document.getElementById('groups');
  try {
    const res = await fetch('/content');
    const data = await res.json();

    const byVolume = (a, b) =>
      (a.volume_number || 0) - (b.volume_number || 0) ||
      String(a.title || '').localeCompare(String(b.title || ''));

    const books = (data.books || []).filter(b => b.visible !== false).sort(byVolume);
    const seriesList = (data.series || [])
      .filter(s => s.visible !== false)
      .slice()
      .sort((a, b) =>
        (a.sort_order || 0) - (b.sort_order || 0) ||
        String(a.name || '').localeCompare(String(b.name || '')));

    const sections = [];

    // One section per series, in the series' own reading order.
    for (const s of seriesList) {
      const inSeries = books.filter(b =>
        b.series_id === s.id && (b.tier === 'series' || (!b.tier && b.volume_number)));
      if (!inSeries.length) continue;
      sections.push(groupSection({
        id: `series-${s.id}`,
        badge: '📖 Series',
        badgeClass: 'series',
        heading: s.name,
        blurb: s.universeDesc || s.description || '',
        books: inSeries,
      }));
    }

    // Novellas that stand alone inside the master series.
    sections.push(groupSection({
      id: 'novellas',
      badge: '✨ Novella Standalones',
      badgeClass: 'novella',
      heading: 'Novella Standalones',
      blurb: 'Self-contained stories, no prior reading required.',
      books: books.filter(b => b.tier === 'novella'),
    }));

    // Collected editions.
    sections.push(groupSection({
      id: 'omnibuses',
      badge: '📚 Omnibuses',
      badgeClass: 'omnibus',
      heading: 'Omnibuses',
      blurb: 'Complete arcs collected in a single volume.',
      books: books.filter(b => b.tier === 'omnibus'),
    }));

    const rendered = sections.join('').trim();
    groupsEl.innerHTML = rendered || emptyState('📚', 'The collection is being catalogued. Check back soon.');

    // Jump-nav, built from whatever actually rendered (no dead anchors).
    document.getElementById('series-jump').innerHTML = [...groupsEl.querySelectorAll('.tier-section')]
      .map(sec => `<a href="#${sec.id}">${esc(sec.querySelector('h2').textContent)}</a>`)
      .join('');

  } catch (e) {
    console.error('Failed to load books:', e);
    groupsEl.innerHTML = emptyState('⚠️', 'Failed to load books. Please try again later.');
  }
}

// Load books on page load
loadBooks();
</script>

</body>
</html>
