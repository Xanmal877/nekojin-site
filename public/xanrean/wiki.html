<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xanrea Wiki</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    
    /* Header */
    .wiki-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .wiki-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .wiki-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--royal);
      text-decoration: none;
    }
    
    .wiki-logo span {
      color: var(--text);
      font-weight: 400;
    }
    
    .wiki-search {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    
    .search-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      color: var(--text);
      width: 300px;
      font-family: inherit;
    }
    
    .search-box:focus {
      outline: none;
      border-color: var(--royal);
    }
    
    .theme-toggle {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.25rem;
    }
    
    /* Layout */
    .wiki-container {
      display: grid;
      grid-template-columns: 250px 1fr 300px;
      max-width: 1400px;
      margin: 0 auto;
      min-height: calc(100vh - 80px);
    }
    
    /* Sidebar */
    .wiki-sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1.5rem;
      overflow-y: auto;
      position: sticky;
      top: 80px;
      height: calc(100vh - 80px);
    }
    
    .sidebar-section {
      margin-bottom: 1.5rem;
    }
    
    .sidebar-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }
    
    .sidebar-list {
      list-style: none;
    }
    
    .sidebar-list li {
      margin-bottom: 0.25rem;
    }
    
    .sidebar-list a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      display: block;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      transition: all 0.2s;
    }
    
    .sidebar-list a:hover,
    .sidebar-list a.active {
      background: var(--surface2);
      color: var(--royal-light);
    }
    
    /* Main content */
    .wiki-main {
      padding: 2rem 3rem;
    }
    
    .wiki-breadcrumb {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    
    .wiki-breadcrumb a {
      color: var(--royal-light);
      text-decoration: none;
    }
    
    .wiki-breadcrumb a:hover {
      text-decoration: underline;
    }
    
    .wiki-article h1 {
      font-family: var(--font-display);
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    
    .wiki-article h2 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      margin: 2rem 0 1rem;
      color: var(--royal-light);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }
    
    .wiki-article h3 {
      font-family: var(--font-display);
      font-size: 1.2rem;
      margin: 1.5rem 0 0.75rem;
      color: var(--text);
    }
    
    .wiki-article p {
      line-height: 1.8;
      margin-bottom: 1rem;
    }
    
    .wiki-article a {
      color: var(--royal-light);
      text-decoration: none;
    }
    
    .wiki-article a:hover {
      text-decoration: underline;
    }
    
    .wiki-article a.wiki-link {
      color: #3b82f6;
      font-weight: 500;
    }
    
    .wiki-article a.wiki-link:hover {
      color: #60a5fa;
    }
    
    .wiki-article ul,
    .wiki-article ol {
      margin-left: 1.5rem;
      margin-bottom: 1rem;
    }
    
    .wiki-article li {
      margin-bottom: 0.5rem;
      line-height: 1.7;
    }
    
    .wiki-article blockquote {
      border-left: 3px solid var(--royal);
      padding-left: 1rem;
      margin: 1.5rem 0;
      color: var(--muted);
      font-style: italic;
    }
    
    .wiki-article code {
      background: var(--surface2);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.9em;
    }
    
    .wiki-article hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }
    
    /* Info box */
    .info-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin: 1.5rem 0;
    }
    
    .info-box-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--royal-light);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    
    /* See Also */
    .see-also {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 2rem;
    }
    
    .see-also-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--royal-light);
      margin-bottom: 1rem;
    }
    
    .see-also-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    
    .see-also-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 0.4rem 1rem;
      font-size: 0.9rem;
      color: var(--text);
      text-decoration: none;
      transition: all 0.2s;
    }
    
    .see-also-item:hover {
      border-color: var(--royal);
      color: var(--royal-light);
    }
    
    /* Right sidebar */
    .wiki-right {
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 1.5rem;
      overflow-y: auto;
      position: sticky;
      top: 80px;
      height: calc(100vh - 80px);
    }
    
    .infocard {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    
    .infocard-image {
      width: 100%;
      aspect-ratio: 1;
      background: var(--bg);
      border-radius: 8px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
    }
    
    .infocard-title {
      font-family: var(--font-display);
      font-size: 1.3rem;
      margin-bottom: 0.25rem;
    }
    
    .infocard-subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    
    .infocard-stat {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    
    .infocard-stat:last-child {
      border-bottom: none;
    }
    
    .infocard-stat-label {
      color: var(--muted);
    }
    
    /* Mobile */
    @media (max-width: 1024px) {
      .wiki-container {
        grid-template-columns: 1fr;
      }
      .wiki-sidebar,
      .wiki-right {
        display: none;
      }
      .wiki-main {
        padding: 1.5rem;
      }
      .search-box {
        width: 200px;
      }
    }
  </style>
</head>
<body>
  <header class="wiki-header">
    <nav class="wiki-nav">
      <a href="/xanrean/wiki" class="wiki-logo">
        <div class="nav-tama" style="width: 32px; height: 32px; background: url('/images/tama-icon.png') center/contain no-repeat;"></div>
        Xanrea <span>Wiki</span>
      </a>
      
      <div class="wiki-search">
        <input type="text" class="search-box" placeholder="Search wiki..." id="search-input">
        <button class="theme-toggle" onclick="toggleTheme()">
          <span id="theme-icon">☀️</span>
        </button>
      </div>
    </nav>
  </header>
  
  <div class="wiki-container">
    <aside class="wiki-sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">Characters</div>
        <ul class="sidebar-list">
          <li><a href="#tama" data-page="tama" class="wiki-nav-link">Admin Creation (Tama)</a></li>
          <li><a href="#saki" data-page="saki" class="wiki-nav-link">Admin Destruction (Saki)</a></li>
          <li><a href="#anna" data-page="anna" class="wiki-nav-link">Water/Anna</a></li>
          <li><a href="#xanari" data-page="xanari" class="wiki-nav-link">Xanari (Xan)</a></li>
        </ul>
      </div>
      
      <div class="sidebar-section">
        <div class="sidebar-title">Species</div>
        <ul class="sidebar-list">
          <li><a href="#nekojin" data-page="nekojin" class="wiki-nav-link">Nekojin</a></li>
          <li><a href="#foxkin" data-page="foxkin" class="wiki-nav-link">Foxkin</a></li>
          <li><a href="#elves" data-page="elves" class="wiki-nav-link">Elves</a></li>
          <li><a href="#kitsune" data-page="kitsune" class="wiki-nav-link">Kitsune</a></li>
          <li><a href="#travelers" data-page="travelers" class="wiki-nav-link">Travelers</a></li>
        </ul>
      </div>
      
      <div class="sidebar-section">
        <div class="sidebar-title">Systems</div>
        <ul class="sidebar-list">
          <li><a href="#xanrea" data-page="xanrea" class="wiki-nav-link">Xanrea Framework</a></li>
          <li><a href="#admins" data-page="admins" class="wiki-nav-link">Administrators</a></li>
          <li><a href="#moderators" data-page="moderators" class="wiki-nav-link">Moderators</a></li>
        </ul>
      </div>
    </aside>
    
    <main class="wiki-main">
      <div class="wiki-breadcrumb" id="breadcrumb">
        <a href="/xanrean">Xanrean Chronicles</a>
        <span>/</span>
        <span>Wiki</span>
      </div>
      
      <article class="wiki-article" id="article-content">
        <div class="loading">Loading...</div>
      </article>
    </main>
    
    <aside class="wiki-right" id="infocard">
      <!-- Dynamic infocard content -->
    </aside>
  </div>
  
  <script>
    // Wiki link database
    const wikiLinks = {
      // Characters
      'Tama': { type: 'character', file: 'admin-creation.md', title: 'Admin Creation (Tama)' },
      'Admin Creation': { type: 'character', file: 'admin-creation.md', title: 'Admin Creation' },
      'Saki': { type: 'character', file: 'admin-destruction.md', title: 'Admin Destruction (Saki)' },
      'Admin Destruction': { type: 'character', file: 'admin-destruction.md', title: 'Admin Destruction' },
      'Anna': { type: 'character', file: 'moderator-time.md', title: 'Water/Anna' },
      'Xanari': { type: 'character', file: 'moderator-space.md', title: 'Xanari (Xan)' },
      'Xan': { type: 'character', file: 'moderator-space.md', title: 'Xanari' },
      
      // Species
      'Nekojin': { type: 'species', section: 'nekojin', title: 'Nekojin' },
      'Foxkin': { type: 'species', section: 'foxkin', title: 'Foxkin' },
      'Elves': { type: 'species', section: 'elves', title: 'Elves' },
      'Kitsune': { type: 'species', section: 'kitsune', title: 'Kitsune' },
      'Wolfkin': { type: 'species', section: 'wolfkin', title: 'Wolfkin' },
      'Travelers': { type: 'species', section: 'travelers', title: 'Travelers' },
      
      // Systems/Concepts
      'The Void': { type: 'concept', title: 'The Void' },
      'Serenity': { type: 'concept', title: 'Serenity (Sword)' },
      'Xanrea': { type: 'concept', title: 'Xanrea Framework' },
      'Server Clusters': { type: 'concept', title: 'Server Clusters' },
    };
    
    // Parse [[Link]] syntax
    function parseWikiLinks(text) {
      return text.replace(/\[\[([^\]]+)\]\]/g, (match, link) => {
        const page = wikiLinks[link];
        if (page) {
          return `<a href="#${link.toLowerCase().replace(/\s+/g, '-')}" class="wiki-link" data-wiki="${link}">${link}</a>`;
        }
        return `<a href="#${link.toLowerCase().replace(/\s+/g, '-')}" class="wiki-link">${link}</a>`;
      });
    }
    
    // Parse markdown
    function parseMarkdown(md) {
      let html = md
        // Headers
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        // Bold/italic
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        // Code
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        // Lists
        .replace(/^- (.*$)/gim, '<li>$1</li>')
        // HR
        .replace(/^---$/gim, '<hr>');
      
      // Parse wiki links
      html = parseWikiLinks(html);
      
      // Wrap lists
      html = html.replace(/(<li>.*?<\/li>)+/gs, '<ul>$&</ul>');
      
      // Paragraphs (after lists)
      html = html.replace(/\n\n+/g, '</p><p>');
      html = html.replace(/^(?!<[hlu])/gim, '<p>');
      html = html.replace(/$(?!<\/)/gim, '</p>');
      
      return html;
    }
    
    // Extract references from text
    function extractReferences(text) {
      const refs = [];
      const seen = new Set();
      
      for (const [key, value] of Object.entries(wikiLinks)) {
        if (text.includes(key) && !seen.has(key)) {
          refs.push({ name: key, ...value });
          seen.add(key);
        }
      }
      
      return refs.slice(0, 8); // Limit to 8 references
    }
    
    // Load wiki page
    async function loadWikiPage(pageName) {
      const content = document.getElementById('article-content');
      content.innerHTML = '<div class="loading">Loading...</div>';
      
      try {
        // Map page names to files
        const fileMap = {
          'tama': 'admin-creation.md',
          'admin-creation': 'admin-creation.md',
          'saki': 'admin-destruction.md',
          'admin-destruction': 'admin-destruction.md',
          'anna': 'moderator-time.md',
          'xanari': 'moderator-space.md',
          'compendium': 'compendium.md'
        };
        
        const file = fileMap[pageName.toLowerCase()] || 'compendium.md';
        const response = await fetch(`/data/characters/${file}`);
        const md = await response.text();
        
        // Parse content
        const html = parseMarkdown(md);
        content.innerHTML = `<div class="wiki-article">${html}</div>`;
        
        // Extract and show references
        const refs = extractReferences(md);
        if (refs.length > 0) {
          const seeAlso = document.createElement('div');
          seeAlso.className = 'see-also';
          seeAlso.innerHTML = `
            <div class="see-also-title">📎 See Also</div>
            <div class="see-also-list">
              ${refs.map(r => `<a href="#${r.name.toLowerCase().replace(/\s+/g, '-')}" class="see-also-item" data-wiki="${r.name}">${r.title || r.name}</a>`).join('')}
            </div>
          `;
          content.querySelector('.wiki-article').appendChild(seeAlso);
        }
        
        // Update infocard
        updateInfocard(pageName, md);
        
        // Update breadcrumb
        updateBreadcrumb(pageName);
        
        // Highlight active in sidebar
        document.querySelectorAll('.wiki-nav-link').forEach(link => {
          link.classList.toggle('active', link.dataset.page === pageName);
        });
        
      } catch (err) {
        content.innerHTML = `<p>Error loading page: ${err.message}</p>`;
      }
    }
    
    function updateInfocard(pageName, content) {
      const infocard = document.getElementById('infocard');
      
      // Extract basic stats from content
      const nameMatch = content.match(/##?\s*(.+?)(?:\n|$)/);
      const ageMatch = content.match(/\*\*Age:\*\*\s*(\d+)/);
      const levelMatch = content.match(/\*\*Level:\*\*\s*(\d+)/);
      const elementMatch = content.match(/\*\*Primary Element:\*\*\s*(.+?)(?:\n|$)/);
      const speciesMatch = content.match(/\*\*Species:\*\*\s*(.+?)(?:\n|$)/);
      
      const title = nameMatch ? nameMatch[1] : pageName;
      
      infocard.innerHTML = `
        <div class="infocard">
          <div class="infocard-image">🎭</div>
          <div class="infocard-title">${title}</div>
          <div class="infocard-subtitle">${wikiLinks[title]?.type || 'Character'}</div>
          ${ageMatch ? `
            <div class="infocard-stat">
              <span class="infocard-stat-label">Age</span>
              <span>${ageMatch[1]}</span>
            </div>
          ` : ''}
          ${levelMatch ? `
            <div class="infocard-stat">
              <span class="infocard-stat-label">Level</span>
              <span>${levelMatch[1]}</span>
            </div>
          ` : ''}
          ${elementMatch ? `
            <div class="infocard-stat">
              <span class="infocard-stat-label">Element</span>
              <span>${elementMatch[1]}</span>
            </div>
          ` : ''}
          ${speciesMatch ? `
            <div class="infocard-stat">
              <span class="infocard-stat-label">Species</span>
              <span>${speciesMatch[1]}</span>
            </div>
          ` : ''}
        </div>
      `;
    }
    
    function updateBreadcrumb(pageName) {
      const crumb = document.getElementById('breadcrumb');
      const title = wikiLinks[pageName]?.title || pageName;
      crumb.innerHTML = `
        <a href="/xanrean">Xanrean Chronicles</a>
        <span>/</span>
        <a href="/xanrean/wiki">Wiki</a>
        <span>/</span>
        <span>${title}</span>
      `;
    }
    
    // Handle navigation
    document.querySelectorAll('.wiki-nav-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const page = link.dataset.page;
        loadWikiPage(page);
        history.pushState({ page }, '', `#${page}`);
      });
    });
    
    // Handle wiki links in content
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('wiki-link')) {
        e.preventDefault();
        const page = e.target.dataset.wiki || e.target.textContent;
        const pageKey = Object.keys(wikiLinks).find(k => k.toLowerCase() === page.toLowerCase());
        if (pageKey) {
          loadWikiPage(pageKey.toLowerCase().replace(/\s+/g, '-'));
          history.pushState({ page: pageKey }, '', `#${pageKey.toLowerCase().replace(/\s+/g, '-')}`);
        }
      }
    });
    
    // Handle back/forward
    window.addEventListener('popstate', (e) => {
      if (e.state?.page) {
        loadWikiPage(e.state.page);
      }
    });
    
    // Theme toggle
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'light';
      const next = current === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      document.getElementById('theme-icon').textContent = next === 'dark' ? '🌙' : '☀️';
    }
    document.getElementById('theme-icon').textContent = 
      (document.documentElement.getAttribute('data-theme') === 'dark') ? '🌙' : '☀️';
    
    // Load initial page
    const hash = window.location.hash.slice(1) || 'tama';
    loadWikiPage(hash);
  </script>
</body>
</html>
