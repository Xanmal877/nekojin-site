<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Lore - Xanrean Chronicles | Nekojin Interactive</title>
  <meta name="description" content="Explore the lore of Xanrea: Characters, Species, and Worldbuilding.">
  <link rel="stylesheet" href="/style.css">
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <style>
    :root {
      --lore-characters-bg: url('/images/tama-bg.png');
      --lore-species-bg: url('/images/tama-bg.png');
      --lore-world-bg: url('/images/tama-bg.png');
    }
    
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(139,92,237,0.1);
    }
    
    [data-theme="dark"] nav {
      background: rgba(10,6,20,0.9);
      border-bottom-color: rgba(139,92,237,0.2);
    }
    
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-display);
      font-size: 1.4rem;
      color: var(--royal);
      text-decoration: none;
    }
    
    .nav-tama {
      width: 32px;
      height: 32px;
      image-rendering: pixelated;
      background: url('/images/tama-icon.png') center/contain no-repeat;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      height: 100%;
      overflow: hidden;
    }
    
    body {
      display: flex;
      flex-direction: column;
    }
    
    main {
      width: 100%;
      margin: 0;
      padding: 0;
      margin-top: 60px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    
    .hub-choice {
      display: flex;
      flex: 1;
      width: 100%;
      margin: 0;
      padding: 0.5rem;
      gap: 0.5rem;
      align-items: stretch;
    }
    
    .hub-panel {
      flex: 1;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 3rem;
      padding-top: 3vh;
      text-decoration: none;
      overflow: hidden;
      transition: all 0.4s ease;
      border-radius: 8px;
    }
    
    .hub-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.3);
      transition: background 0.4s;
    }
    
    .hub-panel:hover::after {
      background: rgba(0,0,0,0.2);
    }
    
    [data-theme="light"] .hub-panel::after {
      background: rgba(255,255,255,0.1);
    }
    
    [data-theme="light"] .hub-panel:hover::after {
      background: rgba(255,255,255,0.05);
    }
    
    .hub-panel-characters {
      background: linear-gradient(180deg, rgba(139,92,246,0.1) 0%, rgba(10,6,20,0.9) 100%),
                  var(--lore-characters-bg) center bottom / contain no-repeat;
      border-right: 1px solid rgba(139,92,246,0.3);
    }
    
    .hub-panel-species {
      background: linear-gradient(180deg, rgba(16,185,129,0.1) 0%, rgba(10,6,20,0.9) 100%),
                  var(--lore-species-bg) center bottom / contain no-repeat;
      border-right: 1px solid rgba(16,185,129,0.3);
    }
    
    .hub-panel-world {
      background: linear-gradient(180deg, rgba(59,130,246,0.1) 0%, rgba(10,6,20,0.9) 100%),
                  var(--lore-world-bg) center bottom / contain no-repeat;
    }
    
    [data-theme="light"] .hub-panel-characters {
      background: linear-gradient(180deg, rgba(139,92,246,0.15) 0%, rgba(20,10,40,0.7) 100%),
                  var(--lore-characters-bg) center bottom / contain no-repeat;
    }
    
    [data-theme="light"] .hub-panel-species {
      background: linear-gradient(180deg, rgba(16,185,129,0.15) 0%, rgba(10,40,20,0.7) 100%),
                  var(--lore-species-bg) center bottom / contain no-repeat;
    }
    
    [data-theme="light"] .hub-panel-world {
      background: linear-gradient(180deg, rgba(59,130,246,0.15) 0%, rgba(10,20,40,0.7) 100%),
                  var(--lore-world-bg) center bottom / contain no-repeat;
    }
    
    .hub-content {
      position: relative;
      z-index: 1;
      text-align: center;
    }
    
    .hub-title {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 1rem;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    
    .hub-title-characters {
      background: linear-gradient(135deg, #c4b5fd, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .hub-title-species {
      background: linear-gradient(135deg, #a7f3d0, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .hub-title-world {
      background: linear-gradient(135deg, #bfdbfe, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .hub-desc {
      color: rgba(255,255,255,0.9);
      font-size: 1.1rem;
      line-height: 1.7;
      margin-bottom: 2rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    
    [data-theme="light"] .hub-desc {
      color: rgba(255,255,255,0.95);
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    }
    
    .hub-cta {
      display: inline-block;
      padding: 1rem 2rem;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      transition: all 0.3s;
      backdrop-filter: blur(4px);
    }
    
    .hub-panel:hover .hub-cta {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.6);
      transform: translateY(-4px);
    }
    
    footer {
      flex-shrink: 0;
      height: 52px;
      background: rgba(10,6,20,0.9);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .footer-link {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
    }
    
    @media (max-width: 768px) {
      .hub-choice {
        flex-direction: column;
        height: calc(100vh - 60px - 52px);
      }
      
      .hub-panel {
        border-right: none;
        border-bottom: 1px solid rgba(139,92,237,0.3);
      }
      
      .hub-panel:last-child {
        border-bottom: none;
      }
    }
  </style>
</head>
<body>

<nav>
  <a href="/xanrean" class="nav-logo">
    <div class="nav-tama"></div>
    Xanrean Chronicles
  </a>
  <span style="color: var(--muted);">The Lore</span>
</nav>

<main>
  <section class="hub-choice">
    <a href="/xanrean/lore/characters" class="hub-panel hub-panel-characters">
      <div class="hub-content">
        <h2 class="hub-title hub-title-characters">Characters</h2>
        <p class="hub-desc">Admins, Moderators, and the souls of Xanrea</p>
        <span class="hub-cta">Meet the Cast →</span>
      </div>
    </a>
    
    <a href="/xanrean/lore/species" class="hub-panel hub-panel-species">
      <div class="hub-content">
        <h2 class="hub-title hub-title-species">Species</h2>
        <p class="hub-desc">Nekojin, Foxkin, Elves, Travelers, and more</p>
        <span class="hub-cta">Explore Species →</span>
      </div>
    </a>
    
    <a href="/xanrean/lore/world" class="hub-panel hub-panel-world">
      <div class="hub-content">
        <h2 class="hub-title hub-title-world">Worlds</h2>
        <p class="hub-desc">Server Clusters, magic systems, and worldbuilding</p>
        <span class="hub-cta">Explore Worlds →</span>
      </div>
    </a>
  </section>
</main>

<footer>
  <a href="/xanrean" class="footer-link">← Back to Xanrean Chronicles</a>
</footer>

</body>
</html>
