<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Destruction (Saki) - Xanrea Wiki</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    
    /* Header */
    .wiki-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .wiki-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .wiki-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--royal);
      text-decoration: none;
    }
    
    .wiki-logo span {
      color: var(--text);
      font-weight: 400;
    }
    
    .theme-toggle {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.25rem;
    }
    
    /* Layout */
    .wiki-container {
      display: grid;
      grid-template-columns: 250px 1fr 300px;
      max-width: 1400px;
      margin: 0 auto;
      min-height: calc(100vh - 80px);
    }
    
    /* Sidebar */
    .wiki-sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1.5rem;
      overflow-y: auto;
      position: sticky;
      top: 80px;
      height: calc(100vh - 80px);
    }
    
    .sidebar-section {
      margin-bottom: 1.5rem;
    }
    
    .sidebar-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }
    
    .sidebar-list {
      list-style: none;
    }
    
    .sidebar-list li {
      margin-bottom: 0.25rem;
    }
    
    .sidebar-list a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      display: block;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      transition: all 0.2s;
    }
    
    .sidebar-list a:hover,
    .sidebar-list a.active {
      background: var(--surface2);
      color: var(--royal-light);
    }
    
    /* Main content */
    .wiki-main {
      padding: 2rem 3rem;
    }
    
    .wiki-breadcrumb {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    
    .wiki-breadcrumb a {
      color: var(--royal-light);
      text-decoration: none;
    }
    
    .wiki-breadcrumb a:hover {
      text-decoration: underline;
    }
    
    .wiki-article h1 {
      font-family: var(--font-display);
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    
    .wiki-article h2 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      margin: 2rem 0 1rem;
      color: var(--royal-light);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }
    
    .wiki-article h3 {
      font-family: var(--font-display);
      font-size: 1.2rem;
      margin: 1.5rem 0 0.75rem;
      color: var(--text);
    }
    
    .wiki-article p {
      line-height: 1.8;
      margin-bottom: 1rem;
    }
    
    .wiki-article a.wiki-link {
      color: #3b82f6;
      text-decoration: none;
    }
    
    .wiki-article a.wiki-link:hover {
      text-decoration: underline;
    }
    
    .wiki-article ul,
    .wiki-article ol {
      margin-left: 1.5rem;
      margin-bottom: 1rem;
    }
    
    .wiki-article li {
      margin-bottom: 0.5rem;
      line-height: 1.7;
    }
    
    .wiki-article blockquote {
      border-left: 3px solid var(--royal);
      padding-left: 1rem;
      margin: 1.5rem 0;
      color: var(--muted);
      font-style: italic;
    }
    
    .wiki-article code {
      background: var(--surface2);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.9em;
    }
    
    .wiki-article hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }
    
    /* See Also */
    .see-also {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 2rem;
    }
    
    .see-also-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--royal-light);
      margin-bottom: 1rem;
    }
    
    .see-also-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    
    .see-also-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 0.4rem 1rem;
      font-size: 0.9rem;
      color: var(--text);
      text-decoration: none;
      transition: all 0.2s;
    }
    
    .see-also-item:hover {
      border-color: var(--royal);
      color: var(--royal-light);
    }
    
    /* Infocard */
    .wiki-right {
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 1.5rem;
      overflow-y: auto;
      position: sticky;
      top: 80px;
      height: calc(100vh - 80px);
    }
    
    .infocard {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    
    .infocard-image {
      width: 100%;
      aspect-ratio: 1;
      background: var(--bg);
      border-radius: 8px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
    }
    
    .infocard-title {
      font-family: var(--font-display);
      font-size: 1.3rem;
      margin-bottom: 0.25rem;
    }
    
    .infocard-subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    
    .infocard-stat {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    
    .infocard-stat:last-child {
      border-bottom: none;
    }
    
    .infocard-stat-label {
      color: var(--muted);
    }
    
    /* Loading */
    .loading {
      text-align: center;
      padding: 4rem;
      color: var(--muted);
    }
    
    /* Mobile */
    @media (max-width: 1024px) {
      .wiki-container {
        grid-template-columns: 1fr;
      }
      .wiki-sidebar,
      .wiki-right {
        display: none;
      }
      .wiki-main {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header class="wiki-header">
    <nav class="wiki-nav">
      <a href="/xanrean/wiki" class="wiki-logo">
        <div class="nav-tama" style="width: 32px; height: 32px; background: url('/images/tama-icon.png') center/contain no-repeat;"></div>
        Xanrea <span>Wiki</span>
      </a>
      <button class="theme-toggle" onclick="toggleTheme()">
        <span id="theme-icon">☀️</span>
      </button>
    </nav>
  </header>
  
  <div class="wiki-container">
    <aside class="wiki-sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">Characters</div>
        <ul class="sidebar-list">
          <li><a href="/xanrean/characters/tama">Admin Destruction</a></li>
          <li><a href="/xanrean/characters/saki" class="active">Admin Destruction</a></li>
          <li><a href="/xanrean/wiki#anna">Water/Anna</a></li>
          <li><a href="/xanrean/wiki#xanari">Xanari</a></li>
        </ul>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Related</div>
        <ul class="sidebar-list">
          <li><a href="/xanrean/lore/reader.html#nekojin">Nekojin</a></li>
          <li><a href="/xanrean/lore/reader.html#travelers">Travelers</a></li>
          <li><a href="/xanrean/characters/admins">The Admins</a></li>
        </ul>
      </div>
    </aside>
    
    <main class="wiki-main">
      <div class="wiki-breadcrumb">
        <a href="/xanrean">Xanrean Chronicles</a>
        <span>/</span>
        <a href="/xanrean/wiki">Wiki</a>
        <span>/</span>
        <span>Characters</span>
      </div>
      
      <article class="wiki-article" id="article-content">
        <div class="loading">Loading...</div>
      </article>
    </main>
    
    <aside class="wiki-right" id="infocard">
      <!-- Dynamic infocard -->
    </aside>
  </div>

  <script>
    // Wiki link database
    const wikiLinks = {
      'Saki': { type: 'character', title: 'Admin Destruction (Saki)' },
      'Admin Destruction': { type: 'character', title: 'Admin Destruction' },
      'Saki': { type: 'character', title: 'Admin Destruction (Saki)' },
      'Admin Destruction': { type: 'character', title: 'Admin Destruction' },
      'Anna': { type: 'character', title: 'Water/Anna' },
      'Serenity': { type: 'concept', title: 'Serenity (Sword)' },
      'Nekojin': { type: 'species', url: '/xanrean/lore/reader.html#nekojin' },
      'Travelers': { type: 'species', url: '/xanrean/lore/reader.html#travelers' },
      'The Void': { type: 'concept', title: 'The Void' },
      'Sensei': { type: 'character', title: 'Sensei' },
    };
    
    function parseWikiLinks(text) {
      return text.replace(/\[\[([^\]]+)\]\]/g, (match, link) => {
        const page = wikiLinks[link];
        if (page?.url) {
          return `<a href="${page.url}" class="wiki-link">${link}</a>`;
        }
        return `<a href="/xanrean/wiki#${link.toLowerCase().replace(/\s+/g, '-')}" class="wiki-link">${link}</a>`;
      });
    }
    
    function parseMarkdown(md) {
      let html = md
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^- (.*$)/gim, '<li>$1</li>')
        .replace(/^---$/gim, '<hr>');
      
      html = parseWikiLinks(html);
      html = html.replace(/(<li>.*<\/li>)+/gs, '<ul>$&</ul>');
      html = html.replace(/\n\n+/g, '</p><p>');
      html = html.replace(/^(?!<[hlu])/gim, '<p>');
      html = html.replace(/$(?!\<\/)/gim, '</p>');
      
      return html;
    }
    
    function extractReferences(text) {
      const refs = [];
      const seen = new Set();
      for (const [key, value] of Object.entries(wikiLinks)) {
        if (text.includes(key) && !seen.has(key) && key !== 'Saki' && key !== 'Admin Destruction') {
          refs.push({ name: key, ...value });
          seen.add(key);
        }
      }
      return refs.slice(0, 8);
    }
    
    async function loadContent() {
      try {
        const response = await fetch('/data/characters/admin-destruction.md');
        const md = await response.text();
        
        document.getElementById('article-content').innerHTML = parseMarkdown(md);
        
        const refs = extractReferences(md);
        if (refs.length > 0) {
          const seeAlso = document.createElement('div');
          seeAlso.className = 'see-also';
          seeAlso.innerHTML = `
            <div class="see-also-title">📎 See Also</div>
            <div class="see-also-list">
              ${refs.map(r => `<a href="${r.url || '/xanrean/wiki#' + r.name.toLowerCase().replace(/\s+/g, '-')}" class="see-also-item">${r.title || r.name}</a>`).join('')}
            </div>
          `;
          document.getElementById('article-content').appendChild(seeAlso);
        }
        
        // Build infocard
        const nameMatch = md.match(/##?\s*([^\n]+)/);
        const ageMatch = md.match(/\*\*Age:\*\*\s*(\d+)/);
        const levelMatch = md.match(/\*\*Level:\*\*\s*(\d+)/);
        const elementMatch = md.match(/\*\*Primary Element:\*\*\s*([^\n]+)/);
        const speciesMatch = md.match(/\*\*Species:\*\*\s*([^\n]+)/);
        
        document.getElementById('infocard').innerHTML = `
          <div class="infocard">
            <div class="infocard-image">🔥</div>
            <div class="infocard-title">${nameMatch ? nameMatch[1] : 'Admin Destruction'}</div>
            <div class="infocard-subtitle">Administrator</div>
            ${ageMatch ? `<div class="infocard-stat"><span class="infocard-stat-label">Age</span><span>${ageMatch[1]}</span></div>` : ''}
            ${levelMatch ? `<div class="infocard-stat"><span class="infocard-stat-label">Level</span><span>${levelMatch[1]}</span></div>` : ''}
            ${elementMatch ? `<div class="infocard-stat"><span class="infocard-stat-label">Element</span><span>${elementMatch[1]}</span></div>` : ''}
            ${speciesMatch ? `<div class="infocard-stat"><span class="infocard-stat-label">Species</span><span>${speciesMatch[1]}</span></div>` : ''}
          </div>
        `;
        
      } catch (err) {
        document.getElementById('article-content').innerHTML = '<p>Error loading content.</p>';
      }
    }
    
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'light';
      const next = current === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      document.getElementById('theme-icon').textContent = next === 'dark' ? '🌙' : '☀️';
    }
    document.getElementById('theme-icon').textContent = 
      (document.documentElement.getAttribute('data-theme') === 'dark') ? '🌙' : '☀️';
    
    loadContent();
  </script>
</body>
</html>
