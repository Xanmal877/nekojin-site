<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Destruction (Saki) | Xanrean Chronicles</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    /* Particle background */
    .particles { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; opacity: 0.3; }
    .particle { position: absolute; width: 4px; height: 4px; background: #dc2626; border-radius: 50%; animation: float 20s infinite linear; }
    @keyframes float { from { transform: translateY(100vh) rotate(0deg); } to { transform: translateY(-100vh) rotate(720deg); } }
    
    /* View toggle */
    .view-toggle { position: fixed; top: 5rem; right: 2rem; z-index: 99; display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 100px; padding: 0.25rem; cursor: pointer; }
    .view-option { padding: 0.5rem 1rem; border-radius: 100px; font-size: 0.8rem; font-weight: 600; transition: all 0.3s; }
    .view-option.active { background: #dc2626; color: white; }
    
    /* Navigation */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; background: rgba(10,6,20,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(220,38,38,0.2); }
    .nav-logo { display: flex; align-items: center; gap: 0.75rem; font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; color: var(--royal); text-decoration: none; }
    .nav-tama { width: 32px; height: 32px; background: url('/images/tama-icon.png') center/contain no-repeat; image-rendering: pixelated; }
    .theme-toggle { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.25rem; color: var(--text); }
    
    /* Hero */
    .char-hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; padding: 6rem 2rem; background: linear-gradient(135deg, rgba(220,38,38,0.15), rgba(10,6,20,0.9)), url('/images/tama-bg.png') center/cover; }
    .char-hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at center, transparent 0%, var(--bg) 100%); }
    .hero-content { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; max-width: 1400px; width: 100%; position: relative; z-index: 1; }
    
    /* Portrait */
    .portrait-container { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .portrait-frame { width: 400px; height: 400px; border-radius: 50%; border: 4px solid #dc2626; box-shadow: 0 0 60px rgba(220,38,38,0.3), inset 0 0 60px rgba(220,38,38,0.1); overflow: hidden; position: relative; animation: pulse-glow 4s ease-in-out infinite; }
    @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 60px rgba(220,38,38,0.3); } 50% { box-shadow: 0 0 80px rgba(220,38,38,0.5); } }
    .portrait-frame img { width: 100%; height: 100%; object-fit: cover; }
    .badge { position: absolute; padding: 0.5rem 1rem; background: var(--surface); border: 2px solid #dc2626; border-radius: 100px; font-size: 0.8rem; font-weight: 700; animation: float-badge 6s ease-in-out infinite; }
    @keyframes float-badge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .badge.tier { top: 10%; left: 0; }
    .badge.level { top: 30%; right: -20px; }
    .badge.element { bottom: 20%; left: -20px; }
    
    /* Stats */
    .stats-display { background: rgba(10,6,20,0.8); border: 1px solid rgba(220,38,38,0.3); border-radius: 20px; padding: 2rem; backdrop-filter: blur(10px); }
    .stat-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    .stat-label { width: 100px; font-size: 0.9rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-bar { flex: 1; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
    .stat-fill { height: 100%; background: linear-gradient(90deg, #dc2626, #fca5a5); border-radius: 4px; width: 0%; transition: width 2s ease-out; }
    .stat-value { width: 50px; text-align: right; font-family: var(--font-display); font-size: 1.1rem; color: #fca5a5; }
    
    /* Character info */
    .char-info { padding-top: 2rem; }
    .char-name { font-family: var(--font-display); font-size: clamp(2.5rem, 5vw, 4rem); background: linear-gradient(135deg, #fca5a5, #dc2626); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 0.5rem; }
    .char-titles { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
    .title-tag { padding: 0.25rem 0.75rem; background: rgba(220,38,38,0.2); border: 1px solid rgba(220,38,38,0.4); border-radius: 100px; font-size: 0.75rem; color: #fca5a5; }
    .char-quote { font-style: italic; font-size: 1.2rem; color: var(--muted); border-left: 3px solid #dc2626; padding-left: 1rem; margin: 1.5rem 0; }
    
    /* Content tabs */
    .bio-section { max-width: 1200px; margin: 0 auto; padding: 4rem 2rem; }
    .section-header { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .tab-btn { padding: 1rem 1.5rem; background: transparent; border: none; color: var(--muted); font-size: 1rem; font-family: var(--font-display); cursor: pointer; position: relative; transition: color 0.3s; }
    .tab-btn.active { color: #fca5a5; }
    .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 3px; background: #dc2626; }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fade-in 0.5s ease; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Markdown content styling */
    .md-content { line-height: 1.8; color: var(--text); }
    .md-content h2 { font-family: var(--font-display); font-size: 1.75rem; margin: 2rem 0 1rem; color: #fca5a5; }
    .md-content h3 { font-family: var(--font-display); font-size: 1.3rem; margin: 1.5rem 0 0.75rem; color: var(--royal-light); }
    .md-content p { margin-bottom: 1rem; }
    .md-content ul, .md-content ol { margin-left: 1.5rem; margin-bottom: 1rem; }
    .md-content li { margin-bottom: 0.5rem; }
    .md-content blockquote { border-left: 3px solid #dc2626; padding-left: 1rem; margin: 1.5rem 0; color: var(--muted); font-style: italic; background: rgba(220,38,38,0.05); padding: 1rem 1rem 1rem 1.5rem; border-radius: 0 8px 8px 0; }
    .md-content strong { color: #fca5a5; }
    .md-content code { background: var(--surface2); padding: 0.2rem 0.4rem; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
    .md-content hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
    
    /* Ability cards */
    .abilities-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
    .ability-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; cursor: pointer; transition: all 0.3s; }
    .ability-card:hover { transform: translateY(-5px); border-color: #dc2626; box-shadow: 0 10px 40px rgba(220,38,38,0.2); }
    .ability-card.expanded { grid-column: 1 / -1; background: linear-gradient(135deg, var(--surface), rgba(220,38,38,0.05)); }
    .ability-card h3 { font-family: var(--font-display); font-size: 1.2rem; margin-bottom: 0.5rem; color: #fca5a5; }
    .ability-card p { color: var(--muted); font-size: 0.95rem; margin: 0; }
    .ability-details { display: none; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
    .ability-card.expanded .ability-details { display: block; }
    
    /* Relation nodes */
    .relation-node { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1rem; background: var(--surface); border: 2px solid var(--border); border-radius: 100px; margin: 0.5rem; transition: all 0.3s; text-decoration: none; color: inherit; }
    .relation-node:hover { border-color: #dc2626; transform: scale(1.05); }
    .relation-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--surface2); }
    
    /* Secret section */
    .secret-section { opacity: 0; transform: translateY(50px); transition: all 0.8s ease; filter: blur(10px); }
    .secret-section.revealed { opacity: 1; transform: translateY(0); filter: blur(0); }
    .reveal-hint { text-align: center; padding: 2rem; color: var(--muted); cursor: pointer; }
    .reveal-hint::after { content: '▼'; display: block; margin-top: 0.5rem; animation: bounce 2s infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(10px); } }
    
    /* Loading state */
    .loading { text-align: center; padding: 4rem; color: var(--muted); }
    .loading::after { content: ''; display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: #dc2626; border-radius: 50%; animation: spin 1s linear infinite; margin-left: 0.5rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    footer { background: var(--surface); border-top: 1px solid var(--border); padding: 0.75rem 1.5rem; margin-top: 4rem; }
    .footer-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .footer-brand { display: flex; align-items: center; gap: 0.5rem; font-family: var(--font-display); font-size: 1rem; color: var(--royal); }
    .footer-tama { width: 24px; height: 24px; background: url('/images/tama-icon.png') center/contain no-repeat; image-rendering: pixelated; }
    .footer-link { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    
    @media (max-width: 968px) { .hero-content { grid-template-columns: 1fr; gap: 2rem; } .portrait-frame { width: 280px; height: 280px; } .view-toggle { top: 5rem; right: 1rem; } }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  
  <div class="view-toggle" onclick="toggleView()">
    <span class="view-option active" id="view-ic">In-Character</span>
    <span class="view-option" id="view-meta">Meta</span>
  </div>

  <nav>
    <a href="/" class="nav-logo"><div class="nav-tama"></div>Nekojin Interactive</a>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
      <span id="theme-icon">☀️</span>
    </button>
  </nav>

  <main>
    <!-- Hero with dynamic content -->
    <section class="char-hero">
      <div class="hero-content">
        <div class="portrait-container">
          <div class="portrait-frame">
            <img src="/images/tama-bg.png" alt="Saki" id="char-portrait">
          </div>
          <span class="badge tier">👑 Administrator</span>
          <span class="badge level" id="char-level">Loading...</span>
          <span class="badge element">🔥 Earth/Air</span>
        </div>
        
        <div class="char-info">
          <h1 class="char-name" id="char-name">Admin Destruction</h1>
          <div class="char-titles" id="char-titles">
            <span class="title-tag">Void Heir</span>
            <span class="title-tag">Nature's Vengeance</span>
            <span class="title-tag">Hero</span>
          </div>
          <p class="char-quote" id="char-quote">"Don't fight it. Use it."</p>
          
          <div class="stats-display" id="stats-display">
            <div class="loading">Loading character data...</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Bio Tabs with MD content -->
    <section class="bio-section">
      <div class="section-header">
        <button class="tab-btn active" onclick="switchTab('overview')">Overview</button>
        <button class="tab-btn" onclick="switchTab('abilities')">Abilities</button>
        <button class="tab-btn" onclick="switchTab('relationships')">Network</button>
        <button class="tab-btn" onclick="switchTab('lore')">Deep Lore</button>
      </div>
      
      <div class="tab-content active" id="tab-overview">
        <div class="md-content" id="md-overview"></div>
      </div>
      
      <div class="tab-content" id="tab-abilities">
        <div class="md-content" id="md-abilities"></div>
      </div>
      
      <div class="tab-content" id="tab-relationships">
        <div class="md-content" id="md-relationships"></div>
      </div>
      
      <div class="tab-content" id="tab-lore">
        <div class="reveal-hint" onclick="revealLore()">
          <p>🔮 Hidden knowledge lies beneath. Dare to uncover it?</p>
        </div>
        <div class="secret-section" id="secret-lore">
          <div class="md-content" id="md-lore"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <div class="footer-brand"><div class="footer-tama"></div>Nekojin Interactive</div>
      <a href="/xanrean/characters/admins" class="footer-link">← Back to The Admins</a>
    </div>
  </footer>

  <script>
    // Initialize particles
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 50; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDelay = Math.random() * 20 + 's';
      p.style.opacity = Math.random() * 0.5;
      particlesContainer.appendChild(p);
    }

    // Simple Markdown parser
    function parseMarkdown(md) {
      let html = md
        // Headers
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        // Bold
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        // Italic
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        // Code
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        // Blockquotes
        .replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>')
        // Horizontal rules
        .replace(/^---$/gim, '<hr>')
        // Unordered lists
        .replace(/^- (.*$)/gim, '<li>$1</li>')
        // Ordered lists
        .replace(/^\d+\. (.*$)/gim, '<li>$1</li>')
        // Wrap lists
        .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
        // Fix nested lists
        .replace(/<ul>(<li>.*<\/li>\n?)+<\/ul>/g, match => match.replace(/<li>(.*)<\/li>/g, '<li>$1</li>'))
        // Paragraphs (must be last)
        .replace(/\n\n/g, '</p><p>')
        .replace(/^(?!<[hlub])/gim, '<p>')
        .replace(/$(?!<\/)/gim, '</p>')
        // Clean up empty paragraphs
        .replace(/<p><\/p>/g, '')
        .replace(/<p>(<h[1-6]>.*?<\/h[1-6]>)<\/p>/g, '$1')
        .replace(/<p>(<ul>.*?<\/ul>)<\/p>/g, '$1')
        .replace(/<p>(<blockquote>.*?<\/blockquote>)<\/p>/g, '$1');
      
      return html;
    }

    // Load and parse the MD file
    async function loadCharacterData() {
      try {
        const response = await fetch('/data/characters/admin-destruction.md');
        const md = await response.text();
        
        // Parse sections
        const sections = {
          overview: '',
          abilities: '',
          relationships: '',
          lore: ''
        };
        
        // Extract key info
        const nameMatch = md.match(/## (.*?\n)/);
        const quoteMatch = md.match(/"([^"]+)"/);
        const ageMatch = md.match(/\*\*Starting Age.*?:\*\* (\d+)/);
        
        if (nameMatch) {
          document.getElementById('char-name').textContent = 'Admin Destruction';
          document.getElementById('char-level').textContent = 'Lv. ' + (ageMatch ? ageMatch[1] : '??');
        }
        
        if (quoteMatch) {
          document.getElementById('char-quote').textContent = '"' + quoteMatch[1] + '"';
        }
        
        // Split content by major sections
        const lines = md.split('\n');
        let currentSection = 'overview';
        let buffer = [];
        
        lines.forEach(line => {
          if (line.startsWith('## ')) {
            sections[currentSection] = buffer.join('\n');
            buffer = [];
            
            const header = line.replace('## ', '').toLowerCase();
            if (header.includes('abilit')) currentSection = 'abilities';
            else if (header.includes('relationship')) currentSection = 'relationships';
            else if (header.includes('origin') || header.includes('void') || header.includes('truth')) currentSection = 'lore';
          }
          buffer.push(line);
        });
        sections[currentSection] = buffer.join('\n');
        
        // Render to tabs
        document.getElementById('md-overview').innerHTML = parseMarkdown(sections.overview);
        document.getElementById('md-abilities').innerHTML = parseMarkdown(sections.abilities);
        document.getElementById('md-relationships').innerHTML = parseMarkdown(sections.relationships);
        document.getElementById('md-lore').innerHTML = parseMarkdown(sections.lore);
        
        // Set up stats
        document.getElementById('stats-display').innerHTML = `
          <div class="stat-row">
            <span class="stat-label">Power</span>
            <div class="stat-bar"><div class="stat-fill" data-value="95"></div></div>
            <span class="stat-value">95</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Strategy</span>
            <div class="stat-bar"><div class="stat-fill" data-value="98"></div></div>
            <span class="stat-value">98</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Control</span>
            <div class="stat-bar"><div class="stat-fill" data-value="72"></div></div>
            <span class="stat-value">72</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Loyalty</span>
            <div class="stat-bar"><div class="stat-fill" data-value="100"></div></div>
            <span class="stat-value">100</span>
          </div>
        `;
        
        // Animate stat bars
        setTimeout(() => {
          document.querySelectorAll('.stat-fill').forEach(bar => {
            bar.style.width = bar.dataset.value + '%';
          });
        }, 500);
        
      } catch (err) {
        console.error('Failed to load character data:', err);
        document.getElementById('md-overview').innerHTML = '<p class="loading">Failed to load character data. Please refresh.</p>';
      }
    }

    // Tab switching
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      event.target.classList.add('active');
    }

    // View toggle
    let metaView = false;
    function toggleView() {
      metaView = !metaView;
      document.getElementById('view-ic').classList.toggle('active', !metaView);
      document.getElementById('view-meta').classList.toggle('active', metaView);
      
      if (metaView) {
        document.getElementById('char-name').textContent = 'Admin Destruction';
        document.querySelector('.badge.tier').textContent = '🔧 System Admin';
      } else {
        document.getElementById('char-name').textContent = 'Saki';
        document.querySelector('.badge.tier').textContent = '👑 Administrator';
      }
    }

    // Reveal secret lore
    function revealLore() {
      document.getElementById('secret-lore').classList.add('revealed');
      event.target.style.display = 'none';
    }

    // Theme toggle
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'light';
      const next = current === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      document.getElementById('theme-icon').textContent = next === 'dark' ? '🌙' : '☀️';
    }
    document.getElementById('theme-icon').textContent = 
      (document.documentElement.getAttribute('data-theme') === 'dark') ? '🌙' : '☀️';

    // Load data on page load
    loadCharacterData();
  </script>
</body>
</html>
