<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character - Xanrean Chronicles</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.7;
    }
    
    .back-link {
      display: inline-block;
      padding: 1rem 2rem;
      color: var(--royal-light);
      text-decoration: none;
    }
    
    .back-link:hover { text-decoration: underline; }
    
    .char-layout {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 2rem;
      padding: 0 2rem 2rem;
    }
    
    .char-sidebar {
      position: sticky;
      top: 20px;
      height: fit-content;
    }
    
    .char-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
    }
    
    .char-avatar {
      width: 140px;
      height: 140px;
      background: var(--surface2);
      border-radius: 50%;
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      overflow: hidden;
    }
    
    .char-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .char-card h2 {
      font-family: var(--font-display);
      font-size: 1.3rem;
      margin-bottom: 0.25rem;
      line-height: 1.3;
    }
    
    .char-card .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    
    .char-stat {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    
    .char-stat:last-child { border-bottom: none; }
    .char-stat-label { color: var(--muted); }
    
    .char-main { min-height: calc(100vh - 100px); }
    
    .char-section { margin-bottom: 2rem; }
    
    .char-section h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    
    .char-section h3 {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--royal-light);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--border);
    }
    
    .char-section p { margin-bottom: 1rem; }
    .char-section ul { margin-left: 1.5rem; margin-bottom: 1rem; }
    .char-section li { margin-bottom: 0.5rem; }
    .char-section strong { color: var(--royal-light); }
    .char-section a { color: var(--royal-light); }
    .char-section a:hover { text-decoration: underline; }
    
    .char-loading, .char-error {
      text-align: center;
      padding: 4rem;
      color: var(--muted);
    }
    
    @media (max-width: 900px) {
      .char-layout { grid-template-columns: 1fr; }
      .char-sidebar { position: static; }
    }
    /* Canon Status Markers */
    .canon-confirmed {
      color: #10b981;
      font-weight: 600;
    }
    
    .canon-unconfirmed {
      color: #6b7280;
      font-style: italic;
    }
    
    .canon-possible {
      color: #f59e0b;
      font-weight: 500;
    }
    
    .canon-verify {
      color: #3b82f6;
      font-weight: 500;
    }
    
    [data-theme="dark"] .canon-confirmed { color: #34d399; }
    [data-theme="dark"] .canon-unconfirmed { color: #9ca3af; }
    [data-theme="dark"] .canon-possible { color: #fbbf24; }
    [data-theme="dark"] .canon-verify { color: #60a5fa; }
    
    /* Content area styling */
    .char-main h1, .char-content h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    
    .char-main h2, .char-content h2 {
      font-size: 1.5rem;
      margin-top: 2rem;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    
    .char-main h3, .char-content h3 {
      font-size: 1.25rem;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      color: var(--text);
    }
    
    .char-main h4, .char-content h4 {
      font-size: 1rem;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      color: var(--muted);
    }
    
    .char-main ul, .char-content ul {
      margin-left: 1.5rem;
      margin-bottom: 1rem;
    }
    
    .char-main li, .char-content li {
      margin-bottom: 0.5rem;
    }
    
    .char-main hr, .char-content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }
    
    .char-main p, .char-content p {
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <a href="/xanrean/characters/admins" class="back-link" id="back-link">← Back to The Admins</a>

  <div class="char-layout">
    <aside class="char-sidebar">
      <div class="char-card" id="char-card">
        <div class="char-avatar" id="char-avatar">👤</div>
        <h2 id="card-name">Loading...</h2>
        <div class="subtitle" id="card-role">Character</div>
        <div id="card-stats"></div>
      </div>
    </aside>

    <main class="char-main" id="char-content">
      <div class="char-loading">Loading character data...</div>
    </main>
  </div>

  <script>
    // Character config - maps URL to file
    const CHARACTERS = {
      // Admins - Entities
      'admin-creation': { 
        file: 'admin-creation.md', 
        emoji: '👑',
        backLink: '/xanrean/characters/admins',
        type: 'Admin'
      },
      'admin-destruction': { 
        file: 'admin-destruction.md', 
        emoji: '🔥',
        backLink: '/xanrean/characters/admins',
        type: 'Admin'
      },
      // Admins - Incarnations  
      'tama': { 
        file: 'tama.md', 
        emoji: '🐱',
        backLink: '/xanrean/characters/admins',
        type: 'Incarnation'
      },
      'saki': { 
        file: 'saki.md', 
        emoji: '🔥',
        backLink: '/xanrean/characters/admins',
        type: 'Incarnation'
      },
      // Other Characters
      'sarah': { 
        file: 'sarah.md', 
        emoji: '⚔️',
        backLink: '/xanrean/characters',
        type: 'Character'
      },
      // Moderators - Entities
      'moderator-time': { 
        file: 'moderator-time.md', 
        emoji: '⏰',
        backLink: '/xanrean/characters/moderators',
        type: 'Moderator'
      },
      'moderator-space': { 
        file: 'moderator-space.md', 
        emoji: '🌌',
        backLink: '/xanrean/characters/moderators',
        type: 'Moderator'
      },
      'moderator-chaos': { 
        file: 'moderator-chaos.md', 
        emoji: '⚡',
        backLink: '/xanrean/characters/moderators',
        type: 'Moderator'
      },
      'moderator-order': { 
        file: 'moderator-order.md', 
        emoji: '⚖️',
        backLink: '/xanrean/characters/moderators',
        type: 'Moderator'
      },
      // Moderators - Incarnations
      'anna': { 
        file: 'anna.md', 
        emoji: '💧',
        backLink: '/xanrean/characters/moderators',
        type: 'Incarnation'
      },
      'xanari': { 
        file: 'xanari.md', 
        emoji: '⚡',
        backLink: '/xanrean/characters/moderators',
        type: 'Incarnation'
      },
      'acros': { 
        file: 'acros.md', 
        emoji: '🌹',
        backLink: '/xanrean/characters/moderators',
        type: 'Incarnation'
      }
    };

    function getCharName() {
      const path = window.location.pathname;
      const match = path.match(/\/characters\/([^\/]+)/);
      return match ? match[1] : 'tama';
    }

    function extractInfoFromContent(md) {
      const info = {};
      
      // Try to find key info from the content
      // Look for patterns like "**Age:**" or "age:" etc.
      const ageMatch = md.match(/\*\*Age:\*\*\s*(.+?)(?:\n|$)/i) || md.match(/-?\s*\*\*Age\*\*:\s*(.+?)(?:\n|$)/i);
      if (ageMatch) info.age = ageMatch[1].trim();
      
      const speciesMatch = md.match(/\*\*Species:\*\*\s*(.+?)(?:\n|$)/i) || md.match(/species is\s+(.+?)(?:\n|\.|,|$)/i);
      if (speciesMatch) info.species = speciesMatch[1].trim();
      
      // Look for Primary/Secondary Element
      const primaryElementMatch = md.match(/\*\*Primary element:\*\*\s*(.+?)(?:\n|$)/i) || md.match(/primary element is\s+(.+?)(?:\n|\.|,|$)/i);
      const secondaryElementMatch = md.match(/\*\*Secondary element:\*\*\s*(.+?)(?:\n|$)/i) || md.match(/secondary element is\s+(.+?)(?:\n|\.|,|$)/i);
      if (primaryElementMatch) info.primaryelement = primaryElementMatch[1].trim();
      if (secondaryElementMatch) info.secondaryelement = secondaryElementMatch[1].trim();
      
      // Look for role/identity
      const roleMatch = md.match(/\*\*Role:\*\*\s*(.+?)(?:\n|$)/i) || md.match(/is (?:a|an) \*\*(.+?)\*\*(?:\n|\.|,|$)/i);
      if (roleMatch) info.role = roleMatch[1].trim();
      
      // Look for underlying identity (for incarnations)
      const identityMatch = md.match(/\*\*Underlying identity:\*\*\s*(.+?)(?:\n|$)/i) || md.match(/incarnation of \*\*(.+?)\*\*(?:\n|\.|,|$)/i);
      if (identityMatch) info.underlyingidentity = identityMatch[1].trim();
      
      return info;
    }

    function mdToHtml(text) {
      // First, handle the Canon Status Key section specially
      let html = text
        // Remove the Canon Status Key block entirely (it's metadata)
        .replace(/## Canon Status Key[\s\S]*?---\n*/i, '')
        // Handle headers - order matters (longest first)
        .replace(/^####\s*(.+)$/gim, '<h4>$1</h4>')
        .replace(/^###\s*(.+)$/gim, '<h3>$1</h3>')
        .replace(/^##\s*(.+)$/gim, '<h2>$1</h2>')
        .replace(/^#\s*(.+)$/gim, '<h1>$1</h1>')
        // Bold/italic
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        // Code
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        // MD links [text](url)
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
        // Horizontal rules
        .replace(/^---$/gim, '<hr>')
        // Lists
        .replace(/^-\s+(.+)$/gim, '<li>$1</li>');
      
      // Wrap list items in ul
      html = html.replace(/(<li>.*<\/li>\n*)+/gs, match => `<ul>${match}</ul>`);
      
      // Handle Canon status markers with styling
      html = html
        .replace(/\*\*Confirmed:\*\*/g, '<span class="canon-confirmed">Confirmed:</span>')
        .replace(/\*\*Not yet established:\*\*/g, '<span class="canon-unconfirmed">Not yet established:</span>')
        .replace(/\*\*Possible:\*\*/g, '<span class="canon-possible">Possible:</span>')
        .replace(/\*\*Requires manuscript verification:\*\*/g, '<span class="canon-verify">Requires manuscript verification:</span>');
      
      // Paragraphs - but preserve existing HTML tags
      html = html
        .replace(/\n\n+/g, '</p><p>')
        .replace(/^(?!<[hlu])/gim, '<p>')
        .replace(/$(?!<\/)/gim, '</p>');
      
      // Clean up empty paragraphs
      html = html.replace(/<p><\/p>/g, '');
      
      return html;
    }

    async function loadCharacter() {
      const charKey = getCharName();
      console.log('Loading character:', charKey);
      const config = CHARACTERS[charKey];
      
      if (!config) {
        document.getElementById('char-content').innerHTML = 
          `<div class="char-error">Character "${charKey}" not found.</div>`;
        return;
      }

      // Update back link
      document.getElementById('back-link').href = config.backLink;

      try {
        console.log('Fetching:', `/data/characters/${config.file}`);
        const response = await fetch(`/data/characters/${config.file}`);
        console.log('Response status:', response.status);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        const md = await response.text();
        console.log('Loaded content length:', md.length);
        
        // Extract name from first h1
        const nameMatch = md.match(/^#\s+(.+?)(?:\n|$)/m);
        const name = nameMatch ? nameMatch[1] : 'Unknown';
        console.log('Extracted name:', name);
        
        // Extract info from content
        const info = extractInfoFromContent(md);
        console.log('Extracted info:', info);
        
        // Update sidebar
        document.getElementById('char-avatar').textContent = config.emoji;
        document.getElementById('card-name').textContent = name;
        
        // Set role/type
        let roleText = config.type;
        if (info.underlyingidentity) {
          roleText = `${config.type} of ${info.underlyingidentity}`;
        } else if (info.role) {
          roleText = info.role;
        }
        document.getElementById('card-role').textContent = roleText;
        document.title = `${name} - Xanrean Chronicles`;
        
        // Build stats
        const stats = [];
        if (info.age) stats.push({label: 'Age', value: info.age});
        if (info.species) stats.push({label: 'Species', value: info.species});
        
        // Elements (without "Level")
        if (info.primaryelement || info.secondaryelement) {
          const primary = info.primaryelement || 'None';
          const secondary = info.secondaryelement || 'None';
          if (secondary !== 'None' && secondary !== 'None currently established' && secondary !== '') {
            stats.push({label: 'Elements', value: `${primary} / ${secondary}`});
          } else {
            stats.push({label: 'Element', value: primary});
          }
        }
        
        const statsHtml = stats.map(s => 
          `<div class="char-stat"><span class="char-stat-label">${s.label}</span><span>${s.value}</span></div>`
        ).join('');
        document.getElementById('card-stats').innerHTML = statsHtml;
        
        // Split and render content
        const sections = md.split(/##\s+/);
        
        let contentHtml = '';
        
        // Process each section
        for (let i = 0; i < sections.length; i++) {
          if (!sections[i].trim()) continue;
          
          const lines = sections[i].split('\n');
          const firstLine = lines[0].trim();
          
          // Skip if this is just the title (starts with #)
          if (firstLine.startsWith('# ')) {
            const body = sections[i].replace(/^#\s+.+\n?/, '').trim();
            if (body) {
              contentHtml += `<div class="char-section">${mdToHtml(body)}</div>`;
            }
            continue;
          }
          
          // Regular section with header
          const title = firstLine;
          const body = lines.slice(1).join('\n').trim();
          
          if (body) {
            contentHtml += `
              <div class="char-section">
                <h3>${title}</h3>
                ${mdToHtml(body)}
              </div>
            `;
          }
        }
        
        document.getElementById('char-content').innerHTML = contentHtml;
        
      } catch (err) {
        console.error('Failed to load:', err);
        document.getElementById('char-content').innerHTML = 
          `<div class="char-error">Failed to load character data.<br><br>Error: ${err.message}</div>`;
        document.getElementById('card-name').textContent = 'Error';
        document.getElementById('card-role').textContent = 'Failed to load';
        document.getElementById('char-avatar').textContent = '❌';
      }
    }

    loadCharacter();
  </script>
</body>
</html>
