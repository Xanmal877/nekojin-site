<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character - Xanrean Chronicles</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.7;
    }
    
    /* Simple top link */
    .back-link {
      display: inline-block;
      padding: 1rem 2rem;
      color: var(--royal-light);
      text-decoration: none;
    }
    
    .back-link:hover {
      text-decoration: underline;
    }
    
    /* Layout */
    .char-layout {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 2rem;
      padding: 0 2rem 2rem;
    }
    
    /* Sidebar */
    .char-sidebar {
      position: sticky;
      top: 20px;
      height: fit-content;
    }
    
    .char-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
    }
    
    .char-avatar {
      width: 120px;
      height: 120px;
      background: var(--surface2);
      border-radius: 50%;
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }
    
    .char-card h2 {
      font-family: var(--font-display);
      font-size: 1.4rem;
      margin-bottom: 0.25rem;
    }
    
    .char-card .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    
    .char-stat {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    
    .char-stat:last-child {
      border-bottom: none;
    }
    
    .char-stat-label {
      color: var(--muted);
    }
    
    /* Main Content */
    .char-main {
      min-height: calc(100vh - 100px);
    }
    
    .char-section {
      margin-bottom: 2rem;
    }
    
    .char-section h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      margin-bottom: 1rem;
      color: var(--text);
    }
    
    .char-section h3 {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--royal-light);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--border);
    }
    
    .char-section p {
      margin-bottom: 1rem;
    }
    
    .char-section ul {
      margin-left: 1.5rem;
      margin-bottom: 1rem;
    }
    
    .char-section li {
      margin-bottom: 0.5rem;
    }
    
    .char-section strong {
      color: var(--royal-light);
    }
    
    .char-section a {
      color: var(--royal-light);
    }
    
    /* Loading/Error */
    .char-loading, .char-error {
      text-align: center;
      padding: 4rem;
      color: var(--muted);
    }
    
    /* Mobile */
    @media (max-width: 900px) {
      .char-layout {
        grid-template-columns: 1fr;
      }
      .char-sidebar {
        position: static;
      }
    }
  </style>
</head>
<body>
  <a href="/xanrean/characters/admins" class="back-link">← Back to The Admins</a>

  <div class="char-layout">
    <aside class="char-sidebar">
      <div class="char-card" id="char-card">
        <div class="char-avatar" id="char-avatar">👤</div>
        <h2 id="card-name">Loading...</h2>
        <div class="subtitle" id="card-role">Character</div>
        <div id="card-stats"></div>
      </div>
    </aside>

    <main class="char-main" id="char-content">
      <div class="char-loading">Loading character data...</div>
    </main>
  </div>

  <script>
    // Character config
    const CHARACTERS = {
      'tama': {
        file: 'Fuyuki Tamaneko.md',
        avatar: '👑',
        emoji: '👑'
      },
      'admin-creation': {
        file: 'Fuyuki Tamaneko.md',
        avatar: '👑',
        emoji: '👑'
      },
      'saki': {
        file: 'Autumnal Sakilera.md',
        avatar: '🔥',
        emoji: '🔥'
      },
      'admin-destruction': {
        file: 'Autumnal Sakilera.md',
        avatar: '🔥',
        emoji: '🔥'
      }
    };

    function getCharName() {
      const path = window.location.pathname;
      const match = path.match(/\/characters\/([^\/]+)/);
      return match ? match[1] : 'tama';
    }

    function extractCoreInfo(md) {
      const info = {};
      
      // Extract name from first h1
      const nameMatch = md.match(/^#\s+(.+?)(?:\n|$)/m);
      info.name = nameMatch ? nameMatch[1] : 'Unknown';
      
      // Extract from Core Information section
      const coreMatch = md.match(/## Core Information([\s\S]*?)(?=##|\Z)/);
      if (coreMatch) {
        const coreSection = coreMatch[1];
        
        // Parse each line
        const lines = coreSection.split('\n');
        lines.forEach(line => {
          const match = line.match(/-\s+\*\*(.+?):\*\*\s*(.+)/);
          if (match) {
            const key = match[1].toLowerCase().replace(/\s+/g, '');
            info[key] = match[2].trim();
          }
        });
      }
      
      return info;
    }

    function mdToHtml(text) {
      return text
        .replace(/^####?\s*(.+)$/gim, '<h4>$1</h4>')
        .replace(/^###\s*(.+)$/gim, '<h3>$1</h3>')
        .replace(/^##\s*(.+)$/gim, '<h2>$1</h2>')
        .replace(/^#\s*(.+)$/gim, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^\[(.+?)\]\((.+?)\)$/gim, '<a href="$2">$1</a>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
        .replace(/^-\s+(.+)$/gim, '<li>$1</li>')
        .replace(/\n\n+/g, '</p><p>')
        .replace(/^(?!<[hlu])/gim, '<p>')
        .replace(/$(?!\<\/)/gim, '</p>')
        .replace(/(<li>.*<\/li>)+/gs, '<ul>$&</ul>');
    }

    async function loadCharacter() {
      const charKey = getCharName();
      const config = CHARACTERS[charKey];
      
      if (!config) {
        document.getElementById('char-content').innerHTML = 
          '<div class="char-error">Character not found</div>';
        return;
      }

      try {
        const response = await fetch(`/data/characters/${encodeURIComponent(config.file)}`);
        const md = await response.text();
        
        // Extract info
        const info = extractCoreInfo(md);
        
        // Update sidebar
        document.getElementById('char-avatar').textContent = config.emoji;
        document.getElementById('card-name').textContent = info.commonname || info.fullname || info.name;
        document.getElementById('card-role').textContent = info.role || 'Character';
        document.title = `${info.commonname || info.name} - Xanrean Chronicles`;
        
        // Build stats from extracted info
        const stats = [];
        if (info.age) stats.push({label: 'Age', value: info.age});
        if (info.level) stats.push({label: 'Level', value: info.level});
        if (info.species) stats.push({label: 'Species', value: info.species});
        if (info.primaryelement) stats.push({label: 'Element', value: info.primaryelement});
        if (info.underlyingidentity) stats.push({label: 'Identity', value: info.underlyingidentity});
        
        const statsHtml = stats.map(s => 
          `<div class="char-stat"><span class="char-stat-label">${s.label}</span><span>${s.value}</span></div>`
        ).join('');
        document.getElementById('card-stats').innerHTML = statsHtml;
        
        // Split content into sections
        const sections = md.split(/##\s+/);
        
        let contentHtml = `<div class="char-section"><h1>${info.name}</h1>`;
        
        // First section (before any ##)
        if (sections[0]) {
          const intro = sections[0].replace(/^#.+\n/, '').trim();
          if (intro) {
            contentHtml += mdToHtml(intro);
          }
        }
        contentHtml += '</div>';
        
        // Other sections
        for (let i = 1; i < sections.length; i++) {
          const section = sections[i];
          const lines = section.split('\n');
          const title = lines[0].trim();
          const body = lines.slice(1).join('\n').trim();
          
          if (body) {
            contentHtml += `
              <div class="char-section">
                <h3>${title}</h3>
                ${mdToHtml(body)}
              </div>
            `;
          }
        }
        
        document.getElementById('char-content').innerHTML = contentHtml;
        
      } catch (err) {
        document.getElementById('char-content').innerHTML = 
          `<div class="char-error">Error loading: ${err.message}</div>`;
      }
    }

    loadCharacter();
  </script>
</body>
</html>
