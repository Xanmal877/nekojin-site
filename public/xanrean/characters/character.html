<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character - Xanrean Chronicles</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <link rel="stylesheet" href="/css/xanrean-characters-character.css">
</head>
<body>
  <a href="/xanrean/characters" class="back-link" id="back-link">← Back to The Cast</a>

  <div class="char-layout">
    <aside class="char-sidebar">
      <div class="char-card" id="char-card">
        <div class="char-avatar" id="char-avatar">👤</div>
        <h2 id="card-name">Loading...</h2>
        <div class="subtitle" id="card-role">Character</div>
        <div id="card-stats"></div>
      </div>
    </aside>

    <main class="char-main" id="char-content">
      <div class="char-loading">Loading character data...</div>
    </main>
  </div>

  <script src="/common.js"></script>
  <script src="/js/xanrean-characters-character.js" defer></script>
</body>
</html>
