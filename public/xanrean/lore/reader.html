<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lore Reader - Xanrean Chronicles</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    nav { 
      position: fixed; top: 0; left: 0; right: 0; z-index: 100; 
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2rem;
      background: rgba(255,255,255,0.9); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(124,58,237,0.1);
    }
    [data-theme="dark"] nav { 
      background: rgba(10,6,20,0.9); border-bottom-color: rgba(124,58,237,0.2); 
    }
    .nav-logo { display: flex; align-items: center; gap: 0.75rem; font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; color: var(--royal); text-decoration: none; }
    .nav-tama { width: 32px; height: 32px; background: url('/images/tama-icon.png') center/contain no-repeat; image-rendering: pixelated; }
    .theme-toggle { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.25rem; color: var(--text); }
    
    main { padding-top: 6rem; min-height: 100vh; display: flex; }
    
    /* Sidebar TOC */
    .sidebar {
      width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 2rem 1.5rem;
      position: fixed;
      height: calc(100vh - 5rem);
      overflow-y: auto;
    }
    .sidebar h2 {
      font-family: var(--font-display);
      font-size: 1.25rem;
      margin-bottom: 1.5rem;
      color: var(--royal-light);
    }
    .toc-list {
      list-style: none;
    }
    .toc-list li {
      margin-bottom: 0.5rem;
    }
    .toc-list a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
      display: block;
      padding: 0.5rem 0;
      border-left: 2px solid transparent;
      padding-left: 1rem;
      margin-left: -1rem;
      transition: all 0.2s;
    }
    .toc-list a:hover,
    .toc-list a.active {
      color: var(--royal-light);
      border-left-color: var(--royal);
    }
    
    /* Content area */
    .content {
      margin-left: 280px;
      flex: 1;
      padding: 2rem 4rem;
      max-width: 800px;
    }
    
    /* Markdown styles */
    .md-content {
      line-height: 1.8;
      color: var(--text);
    }
    .md-content h1 {
      font-family: var(--font-display);
      font-size: 2.5rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--royal-light), var(--royal));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .md-content h2 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      margin: 2.5rem 0 1rem;
      color: var(--royal-light);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }
    .md-content h3 {
      font-family: var(--font-display);
      font-size: 1.3rem;
      margin: 2rem 0 1rem;
      color: var(--text);
    }
    .md-content p {
      margin-bottom: 1rem;
    }
    .md-content ul, .md-content ol {
      margin-left: 1.5rem;
      margin-bottom: 1rem;
    }
    .md-content li {
      margin-bottom: 0.5rem;
    }
    .md-content strong {
      color: var(--royal-light);
    }
    .md-content em {
      color: var(--muted);
    }
    .md-content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }
    .md-content blockquote {
      border-left: 3px solid var(--royal);
      padding-left: 1rem;
      margin: 1.5rem 0;
      color: var(--muted);
      font-style: italic;
    }
    .md-content code {
      background: var(--surface2);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.9em;
    }
    
    /* Loading state */
    .loading {
      text-align: center;
      padding: 4rem;
      color: var(--muted);
    }
    .loading::after {
      content: '';
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--royal);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 0.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 2rem;
      margin-top: 4rem;
    }
    .footer-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .footer-link {
      color: var(--muted);
      text-decoration: none;
    }
    .footer-link:hover {
      color: var(--royal-light);
    }
    
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .content { margin-left: 0; padding: 2rem; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo"><div class="nav-tama"></div>Nekojin Interactive</a>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
    <span id="theme-icon">☀️</span>
  </button>
</nav>

<main>
  <aside class="sidebar">
    <h2>📚 Lore Compendium</h2>
    <ul class="toc-list" id="toc">
      <li><a href="#nekojin" class="toc-link">Nekojin</a></li>
      <li><a href="#foxkin" class="toc-link">Foxkin</a></li>
      <li><a href="#elves" class="toc-link">Elves</a></li>
      <li><a href="#wolfkin" class="toc-link">Wolfkin</a></li>
      <li><a href="#kitsune" class="toc-link">Kitsune</a></li>
      <li><a href="#travelers" class="toc-link">Travelers</a></li>
      <li><a href="#big-picture" class="toc-link">The Big Picture</a></li>
    </ul>
  </aside>
  
  <article class="content">
    <div class="loading" id="content">Loading compendium...</div>
  </article>
</main>

<footer>
  <div class="footer-inner">
    <a href="/xanrean/lore" class="footer-link">← Back to Lore Hub</a>
    <span style="color: var(--muted); font-size: 0.9rem;">Xanrean Chronicles</span>
  </div>
</footer>

<script>
  // Simple Markdown parser
  function parseMarkdown(md) {
    let html = md
      // Headers
      .replace(/^### (.*$)/gim, '<h3>$1</h3>')
      .replace(/^## (.*$)/gim, '<h2 id="$1.toLowerCase().replace(/[^a-z0-9]+/g, '-')">$1</h2>')
      .replace(/^# (.*$)/gim, '<h1>$1</h1>')
      // Bold/italic
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      // Code
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      // Lists
      .replace(/^- (.*$)/gim, '<li>$1</li>')
      // HR
      .replace(/^---$/gim, '<hr>')
      // Paragraphs
      .replace(/\n\n/g, '</p><p>')
      .replace(/^(?!<[hl])/gim, '<p>')
      .replace(/$(?!<\/)/gim, '</p>');
    
    // Wrap lists
    html = html.replace(/(<li>.*<\/li>)+/gs, '<ul>$&</ul>');
    
    // Add IDs to headers for TOC
    html = html.replace(/<h2>(.*?)<\/h2>/g, (match, text) => {
      const id = text.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      return `<h2 id="${id}">${text}</h2>`;
    });
    
    return html;
  }
  
  // Load and display lore
  async function loadLore() {
    try {
      const response = await fetch('/data/lore/compendium.md');
      const md = await response.text();
      
      // Parse and display
      document.getElementById('content').innerHTML = 
        '<div class="md-content">' + parseMarkdown(md) + '</div>';
      
      // Update TOC based on actual headers
      updateTOC();
      
      // Handle hash links
      if (window.location.hash) {
        const target = document.querySelector(window.location.hash);
        if (target) target.scrollIntoView({ behavior: 'smooth' });
      }
      
    } catch (err) {
      document.getElementById('content').innerHTML = 
        '<p style="color: #ef4444;">Failed to load lore compendium. Please refresh.</p>';
    }
  }
  
  function updateTOC() {
    const headers = document.querySelectorAll('.md-content h2[id]');
    const toc = document.getElementById('toc');
    toc.innerHTML = '';
    
    headers.forEach(h => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      a.className = 'toc-link';
      a.onclick = (e) => {
        e.preventDefault();
        h.scrollIntoView({ behavior: 'smooth' });
        history.pushState(null, null, '#' + h.id);
      };
      li.appendChild(a);
      toc.appendChild(li);
    });
  }
  
  // Highlight active section on scroll
  window.addEventListener('scroll', () => {
    const headers = document.querySelectorAll('.md-content h2[id]');
    let current = '';
    
    headers.forEach(h => {
      const rect = h.getBoundingClientRect();
      if (rect.top < 200) current = h.id;
    });
    
    document.querySelectorAll('.toc-link').forEach(link => {
      link.classList.toggle('active', link.getAttribute('href') === '#' + current);
    });
  });
  
  // Theme toggle
  function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme') || 'light';
    const next = current === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    document.getElementById('theme-icon').textContent = next === 'dark' ? '🌙' : '☀️';
  }
  document.getElementById('theme-icon').textContent = 
    (document.documentElement.getAttribute('data-theme') === 'dark') ? '🌙' : '☀️';
  
  // Load on page load
  loadLore();
</script>

</body>
</html>
