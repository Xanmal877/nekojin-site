<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World - The Lore | Xanrean Chronicles</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: auto; }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: rgba(10,6,20,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(59,130,246,0.2);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--royal);
      text-decoration: none;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      margin-top: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    .topic-content {
      width: 100%;
      max-width: 800px;
      color: var(--text);
      line-height: 1.8;
    }

    .topic-content h1 {
      font-family: var(--font-display);
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      color: var(--royal-light);
    }

    .topic-content h2 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      margin: 2rem 0 1rem;
      color: var(--royal-light);
    }

    .topic-content p {
      margin-bottom: 1rem;
      color: var(--muted);
    }

    .topic-content strong {
      color: var(--text);
    }

    .topic-content ul {
      margin: 0 0 1rem 1.5rem;
      color: var(--muted);
    }

    .topic-content li {
      margin-bottom: 0.5rem;
    }

    footer {
      flex-shrink: 0;
      background: rgba(10,6,20,0.9);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .footer-link {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
    }

    .loading {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
      font-family: var(--font-display);
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

<nav>
  <a href="/xanrean/lore/world" class="nav-logo">⬅ Worlds</a>
  <span style="color: var(--muted);">World</span>
</nav>

<main>
  <article id="topic-content" class="topic-content">
    <div class="loading">Loading...</div>
  </article>
</main>

<footer>
  <a href="/xanrean/lore/world" class="footer-link">← Back to Worlds</a>
</footer>

<script>
  function parseMarkdown(md) {
    if (!md) return '';
    md = String(md).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let html = md
      .replace(/^## (.*$)/gim, '<h2>$1</h2>')
      .replace(/^# (.*$)/gim, '<h2>$1</h2>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/^- (.*)$/gim, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
    html = html.split('\n\n').map(block => {
      if (block.startsWith('<h2') || block.startsWith('<ul')) return block;
      return `<p>${block.trim()}</p>`;
    }).join('\n');
    return html;
  }

  async function loadTopic() {
    const slug = window.location.pathname.split('/').pop();
    const container = document.getElementById('topic-content');

    try {
      const response = await fetch(`/api/lore-topics/${encodeURIComponent(slug)}`);
      if (!response.ok) throw new Error('Not found');
      const topic = await response.json();

      document.title = topic.title + ' - The Lore | Xanrean Chronicles';
      container.innerHTML = `<h1>${escapeHtml(topic.title)}</h1>${parseMarkdown(topic.content)}`;
    } catch (err) {
      container.innerHTML = '<div class="loading">Could not load this world topic.</div>';
    }
  }

  function escapeHtml(value) {
    return String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  loadTopic();
</script>

</body>
</html>
