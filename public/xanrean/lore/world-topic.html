<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World - The Lore | Xanrean Chronicles</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <link rel="stylesheet" href="/css/xanrean-lore-world-topic.css">
</head>
<body>

<nav>
  <a href="/xanrean/lore/world" class="nav-logo">⬅ Worlds</a>
  <span style="color: var(--muted);">World</span>
</nav>

<main>
  <article id="topic-content" class="topic-content">
    <div class="loading">Loading...</div>
  </article>
</main>

<footer>
  <a href="/xanrean/lore/world" class="footer-link">← Back to Worlds</a>
</footer>

<script src="/common.js"></script>
<script src="/js/xanrean-lore-world-topic.js" defer></script>

</body>
</html>
