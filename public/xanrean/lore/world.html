<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worlds - The Lore | Xanrean Chronicles</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: rgba(10,6,20,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(59,130,246,0.2);
    }
    
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--royal);
      text-decoration: none;
    }
    
    body {
      display: flex;
      flex-direction: column;
    }
    
    main {
      flex: 1;
      margin-top: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    
    .worlds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 1200px;
    }
    
    .world-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      text-decoration: none;
      color: var(--text);
      transition: all 0.3s;
    }
    
    .world-card:hover {
      border-color: var(--royal);
      transform: translateY(-4px);
    }
    
    .world-card h2 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      color: var(--royal-light);
    }
    
    .world-card p {
      color: var(--muted);
      line-height: 1.6;
    }
    
    footer {
      flex-shrink: 0;
      height: 52px;
      background: rgba(10,6,20,0.9);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .footer-link {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
    }
    
    .placeholder {
      text-align: center;
      color: var(--muted);
      padding: 4rem 2rem;
    }
    
    .placeholder h1 {
      font-family: var(--font-display);
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: var(--text);
    }
  </style>
</head>
<body>

<nav>
  <a href="/xanrean/lore" class="nav-logo">⬅ The Lore</a>
  <span style="color: var(--muted);">Worlds</span>
</nav>

<main>
  <div class="placeholder">
    <h1>🌍 Worlds</h1>
    <p>Explore the Server Clusters, magic systems, and worldbuilding of Xanrea.</p>
    <p style="margin-top: 2rem; opacity: 0.6;">Content coming soon...</p>
  </div>
</main>

<footer>
  <a href="/xanrean/lore" class="footer-link">← Back to The Lore</a>
</footer>

</body>
</html>
