<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worlds - The Lore | Xanrean Chronicles</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <link rel="stylesheet" href="/css/xanrean-lore-world.css">
</head>
<body>

<nav>
  <a href="/xanrean/lore" class="nav-logo">⬅ The Lore</a>
  <span style="color: var(--muted);">Worlds</span>
</nav>

<main>
  <div class="page-header">
    <h1>🌍 Worlds</h1>
    <p>Explore the Server Clusters, magic systems, and worldbuilding of Xanrea.</p>
  </div>

  <div id="loading" class="loading">Loading world data...</div>
  <section id="worlds-grid" class="worlds-grid" style="display: none;"></section>
</main>

<footer>
  <a href="/xanrean/lore" class="footer-link">← Back to The Lore</a>
</footer>

<script src="/common.js"></script>
<script src="/js/xanrean-lore-world.js" defer></script>

</body>
</html>
