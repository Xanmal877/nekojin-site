<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worlds - The Lore | Xanrean Chronicles</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: auto; }
    
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: rgba(10,6,20,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(59,130,246,0.2);
    }
    
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--royal);
      text-decoration: none;
    }
    
    body {
      display: flex;
      flex-direction: column;
    }
    
    main {
      flex: 1;
      margin-top: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    .page-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .page-header h1 {
      font-family: var(--font-display);
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: var(--text);
    }

    .page-header p {
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
    }
    
    .worlds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 1200px;
    }
    
    .world-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      text-decoration: none;
      color: var(--text);
      transition: all 0.3s;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    
    .world-card:hover {
      border-color: var(--royal);
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    
    .world-card h2 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
      color: var(--royal-light);
      text-transform: capitalize;
    }
    
    .world-card .md-content {
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.95rem;
      flex: 1;
    }

    .world-card .cta {
      margin-top: 1.5rem;
      font-weight: 600;
      color: var(--royal-light);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    footer {
      flex-shrink: 0;
      height: 52px;
      background: rgba(10,6,20,0.9);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .footer-link {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
    }

    .loading {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
      font-family: var(--font-display);
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

<nav>
  <a href="/xanrean/lore" class="nav-logo">⬅ The Lore</a>
  <span style="color: var(--muted);">Worlds</span>
</nav>

<main>
  <div class="page-header">
    <h1>🌍 Worlds</h1>
    <p>Explore the Server Clusters, magic systems, and worldbuilding of Xanrea.</p>
  </div>

  <div id="loading" class="loading">Loading world data...</div>
  <section id="worlds-grid" class="worlds-grid" style="display: none;"></section>
</main>

<footer>
  <a href="/xanrean/lore" class="footer-link">← Back to The Lore</a>
</footer>

<script>
  function parseMarkdown(md) {
    if (!md) return '';
    md = String(md).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    return md
      .replace(/^# (.*$)/gim, '<h2 style="font-size:1.2rem; margin-bottom:0.5rem;">$1</h2>')
      .replace(/^## (.*$)/gim, '<h3 style="font-size:1rem; margin-bottom:0.5rem;">$1</h3>')
      .replace(/\*\*(.*?)\*\*/g, '<strong style="color:var(--royal-light)">$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/^(?!<h)/gim, '<p>')
      .replace(/$(?!<\/)/gim, '</p>')
      .split('\n').join(' ');
  }

  async function loadWorlds() {
    const grid = document.getElementById('worlds-grid');
    const loader = document.getElementById('loading');
 
    try {
      const response = await fetch('/api/lore-topics?section=world');
      const topics = await response.json();
 
      if (!topics || topics.length === 0) {
        loader.innerHTML = 'No world data found.';
        return;
      }
 
      const cards = await Promise.all(topics.map(async topic => {
        try {
          // Use a simple summary from the content (first paragraph)
          const summary = topic.content.split('\n\n')[0] || topic.content;
          
          const title = topic.title;
          
          return `
            <a href="/xanrean/lore/world/${encodeURIComponent(topic.slug)}" class="world-card">
              <h2>${escapeHtml(title)}</h2>
              <div class="md-content">
                ${parseMarkdown(summary)}
              </div>
              <div class="cta">Explore World →</div>
            </a>
          `;
        } catch (e) {
          console.error('Error loading topic ' + topic.slug, e);
          return '';
        }
      }));
 
      grid.innerHTML = cards.join('');
      grid.style.display = 'grid';
      loader.style.display = 'none';
    } catch (err) {
      console.error('Error loading worlds', err);
      loader.innerHTML = 'Failed to load world data. Please refresh.';
    }
  }

  function escapeHtml(value) {
    return String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }


  loadWorlds();
</script>

</body>
</html>
