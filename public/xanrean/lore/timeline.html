<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline - The Lore | Xanrean Chronicles</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <link rel="stylesheet" href="/css/xanrean-lore-timeline.css">
</head>
<body>
  <nav>
    <a href="/xanrean/lore" class="nav-logo">⬅ The Lore</a>
    <span style="color: var(--muted);">Timeline</span>
  </nav>
  <main>
    <div class="page-header">
      <h1>⏳ Timeline</h1>
      <p>A chronological record of the events that shaped the World of Xanrea.</p>
    </div>
    <div id="loading" class="loading">Loading timeline data...</div>
    <div id="timeline" class="timeline-container" style="display:none;">
      <div class="timeline-line"></div>
      <div id="events-list"></div>
    </div>
  </main>
  <footer>
    <a href="/xanrean/lore" class="footer-link">← Back to The Lore</a>
  </footer>
  <script src="/common.js"></script>
  <script src="/js/xanrean-lore-timeline.js" defer></script>
</body>
</html>
