  <meta property="og:title" content="Books & Serials - Nekojin Interactive">
  <meta property="og:description" content="Explore interconnected fiction in the Xanrea universe. Fantasy and progression stories with living worlds and complex systems.">
  <meta property="og:image" content="https://worldofxanrea.com/covers/xanrean-cover-books.webp">

  <link rel="alternate" type="application/atom+xml" title="Nekojin Interactive Feed" href="https://worldofxanrea.com/rss.xml">
  <link rel="stylesheet" href="/style.css">
  <script>
    // Theme: Check localStorage first, then system preference, default light
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <link rel="stylesheet" href="/css/books.css">
</head>
<body>

<nav>
  <div class="nav-left">
    <a href="/" class="nav-logo">
      <div class="paw" aria-hidden="true"></div> Nekojin Interactive
    </a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/books" class="active">Books</a></li>
      <li><a href="/games">Games</a></li>

    </ul>
  </div>
  <div class="nav-right">
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" onclick="toggleTheme()">
      <span class="theme-icon sun">☀️</span>
      <span class="theme-icon moon">🌙</span>
    </button>
    <div class="nav-search-wrap">
      <input type="text" class="nav-search" id="nav-search" placeholder="Search…" autocomplete="off">
      <div class="nav-search-results" id="nav-search-results"></div>
    </div>
  </div>
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Menu" onclick="toggleNav()">
    <span></span><span></span><span></span>
  </button>
</nav>
<div class="nav-drawer" id="nav-drawer">
  <ul>
    <li><input type="text" class="drawer-search" id="drawer-search" placeholder="Search…" autocomplete="off"></li>
    <li><div class="drawer-search-results" id="drawer-search-results"></div></li>
    <li><a href="/">Home</a></li>
    <li><a href="/books" class="active">Books</a></li>
    <li><a href="/games">Games</a></li>

  </ul>
</div>

<main>

  <!-- HERO -->
  <section class="books-hero">
    <div class="books-hero-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
    </div>
    <h1 class="books-hero-title"><span class="accent">Books</span> &amp; Serials</h1>
    <p class="books-hero-sub">Stories from the Xanrea universe. First published on Royal Road &amp; ScribbleHub, then refined for Kindle.</p>
  </section>

  <!-- CONTENT -->
  <section style="padding: 2rem 2rem 5rem;">
    <div class="section-inner" id="books-container">
      <div class="books-loading">
        <span class="books-loading-dots">Loading</span>
      </div>
    </div>
  </section>

</main>

<footer>
  <div class="footer-inner">
    <div class="footer-logo"><div class="tama-icon" aria-hidden="true"></div> Nekojin Interactive</div>
    <p class="footer-tagline" id="footer-tagline">Crafting worlds</p>
    <div class="footer-links"></div>
    <p class="footer-copy">© <span id="footer-year"></span> Nekojin Interactive LLC. All rights reserved.</p>
    <script>document.getElementById('footer-year').textContent = new Date().getFullYear();</script>
  </div>
</footer>

<script src="/common.js"></script>
<script src="/js/books.js" defer></script>

</body>
</html>
