<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xanrean Chronicles - Nekojin Interactive</title>
  <meta name="description" content="Enter the Xanrean Server Clusters. Follow Admin Creation and Destruction through interconnected stories of reincarnation, magic, and digital souls.">
  <meta name="keywords" content="xanrea, xanrean chronicles, her majesty tamaneko, nekojin, fantasy, progression fiction, litrpg, reincarnation">
  <meta property="og:title" content="Xanrean Chronicles - Nekojin Interactive">
  <meta property="og:description" content="Enter the Xanrean Server Clusters. Follow Admin Creation and Destruction through interconnected stories.">
  <meta property="og:image" content="https://worldofxanrea.com/covers/homepage-cover-xanrean.webp">
  <meta property="og:url" content="https://worldofxanrea.com/xanrean">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0a0614">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/images/tama-icon.png">
  <link rel="alternate" type="application/atom+xml" title="Nekojin Interactive Feed" href="https://worldofxanrea.com/rss.xml">
  <link rel="stylesheet" href="/style.css">
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <link rel="stylesheet" href="/css/xanrean.css">
</head>
<body>

<nav>
  <a href="/" class="nav-logo">
    <div class="nav-tama"></div>
    Nekojin Interactive
  </a>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
    <span id="theme-icon">☀️</span>
  </button>
</nav>

<main>
  <section class="hub-choice">
    <a href="/xanrean/books" class="hub-panel hub-panel-books">
      <div class="hub-content">
        <h2 class="hub-title hub-title-books">The<br>Books</h2>
        <p class="hub-desc">Read The Story</p>
        <span class="hub-cta">Browse Books →</span>
      </div>
    </a>
    
    <a href="/games" class="hub-panel hub-panel-game">
      <div class="hub-content">
        <h2 class="hub-title hub-title-game">The<br>Games</h2>
        <p class="hub-desc">Experience Xanrea yourself!</p>
        <span class="hub-cta">View Games →</span>
      </div>
    </a>
    
    <a href="/xanrean/lore" class="hub-panel hub-panel-lore">
      <div class="hub-content">
        <h2 class="hub-title hub-title-lore">The<br>Lore</h2>
        <p class="hub-desc">Characters, Species, and Worldbuilding</p>
        <span class="hub-cta">Explore Lore →</span>
      </div>
    </a>
  </section>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-brand">
      <div class="footer-tama"></div>
      <span class="footer-text">Nekojin Interactive</span>
    </div>
    
    <p class="footer-copy">© <span id="footer-year"></span> Nekojin Interactive LLC. All rights reserved.</p>
    <script>document.getElementById('footer-year').textContent = new Date().getFullYear();</script>
    
    <div class="footer-actions">
      <a href="/about" class="footer-link">About</a>
      <a href="https://www.patreon.com/purplexanmal" target="_blank" rel="noopener" class="footer-patreon">
        ☕ Support on Patreon
      </a>
      
      <form class="footer-newsletter" onsubmit="subscribe(event)">
        <input type="email" placeholder="your@email.com" required>
        <button type="submit">Subscribe</button>
      </form>
    </div>
  </div>
</footer>

<div class="nl-message" id="nl-message"></div>

<script src="/common.js"></script>
<script src="/js/xanrean.js" defer></script>

</body>
</html>
